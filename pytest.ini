[pytest]
# Phase-3 remediation (review findings #3):
#   - default `pytest` runs ONLY the unit-test tree (tests); the
#     otel-demo telemetry tests talk to a live Jaeger/Prometheus/OpenSearch
#     cluster and must be opted into explicitly (they are marked `integration`).
#   - `pytest -m integration` or pointing pytest at otel-demo/test/telemetry
#     is the explicit opt-in path.
#   - unit tests are required to never modify versioned artifacts (they
#     monkeypatch paths to temp dirs); this is enforced in tests and by the
#     artifact-hash check in the remediation pipeline.
testpaths = tests
markers =
    integration: 访问真实集群(Jaeger/Prometheus/OpenSearch 等)的集成测试，需显式 opt-in
    unit: 纯单元测试，不访问集群、不修改版本化 artifacts
# Disable pytest's repository-local cache. ``tmp_path`` already uses the OS
# temporary directory, outside the checkout.
addopts = -ra --strict-markers -p no:cacheprovider
