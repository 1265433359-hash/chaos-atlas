[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosatlas"
version = "0.1.0"
description = "Evidence-constrained chaos testing and RCA orchestration"
requires-python = ">=3.10"

[project.scripts]
chaosatlas = "chaosatlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
