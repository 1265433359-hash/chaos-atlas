apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: chaosatlas-immich
  labels:
    app.kubernetes.io/part-of: chaosatlas-apps
    chaosatlas.io/application: immich
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: immich.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
---
