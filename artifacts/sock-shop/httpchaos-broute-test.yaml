# 验证性测试（非注入）：验证自定义内核支持 broute 表
# 这是 HTTPChaos 透明劫持流量的先决条件
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: httpchaos-broute-verify
  namespace: sock-shop-lab
spec:
  mode: one
  selector:
    namespaces:
      - sock-shop-lab
    labelSelectors:
      app: catalogue
  target: Request
  port: 80
  path: "*"
  method: GET
  delay: 500ms
  duration: 30s
