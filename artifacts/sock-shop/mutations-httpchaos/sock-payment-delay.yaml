# HTTPChaos 边级注入: orders->payment (DELAY)
# HTTPChaos 目标 = 服务入站端口，路径 * 匹配全部（单一调用方 -> 等效边级）
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: sock-payment-delay
  namespace: sock-shop-lab
  labels:
    chaos.candidate-id: SOCK-ORDERS-PAYMENT-DELAY-2000
spec:
  mode: one
  selector:
    namespaces:
      - sock-shop-lab
    labelSelectors:
      name: payment
  target: Request
  port: 80
  path: "*"
  method: GET
  delay: 2000ms
  duration: 30s
