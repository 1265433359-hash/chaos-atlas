apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ob-multi-payment-delay
  namespace: online-boutique-lab
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - online-boutique-lab
    labelSelectors:
      app: paymentservice
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
  duration: "25s"
  direction: to
---
