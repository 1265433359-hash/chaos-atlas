apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ob-payment-delay-1500
  namespace: online-boutique-lab
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - online-boutique-lab
    labelSelectors:
      app: paymentservice
  delay:
    latency: "1500ms"
    correlation: "100"
    jitter: "0ms"
  duration: "40s"
  direction: to
