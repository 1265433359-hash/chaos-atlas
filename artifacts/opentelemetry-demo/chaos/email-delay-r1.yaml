apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: otel-email-delay-r1
  namespace: otel-demo-lab
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - otel-demo-lab
    labelSelectors:
      app: email
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
  duration: "25s"
  direction: to
