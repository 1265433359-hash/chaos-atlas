apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-demo-lab
resources:
  - otel_lab_manifest.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: postgres-init
    files:
      - init.sql=init_lite.sql
  - name: flagd-config
    files:
      - demo.flagd.json
