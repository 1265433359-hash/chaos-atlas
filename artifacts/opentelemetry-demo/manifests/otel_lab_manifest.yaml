---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: otel-demo-lab
  labels:
    app: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      containers:
      - name: shipping
        image: ghcr.io/open-telemetry/demo:3.0.0-shipping
        env:
        - name: SHIPPING_PORT
          value: "50050"
        ports:
        - containerPort: 50050
      - name: flagd-sidecar
        image: ghcr.io/open-feature/flagd:v0.16.0
        command: ["/flagd-build", "start", "--uri", "file:/etc/flagd/demo.flagd.json", "--port", "8013"]
        volumeMounts:
        - name: flagd-config
          mountPath: /etc/flagd
      volumes:
      - name: flagd-config
        configMap:
          name: flagd-config
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: otel-demo-lab
spec:
  selector:
    app: shipping
  ports:
  - port: 50050
    targetPort: 50050
