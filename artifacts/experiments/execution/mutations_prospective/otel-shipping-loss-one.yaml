apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: otel-shipping-loss-one
  namespace: otel-demo-lab
  labels:
    chaos.prospective: round2
    chaos.candidate-id: OTEL-SHIPPING-LOSS-100
spec:
  action: loss
  mode: one
  selector:
    namespaces:
    - otel-demo-lab
    labelSelectors:
      app: shipping
  duration: 15s
  direction: to
  loss:
    loss: '100'
    correlation: '100'
