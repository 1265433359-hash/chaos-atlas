apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: otel-quote-delay-one
  namespace: otel-demo-lab
  labels:
    chaos.candidate-id: OTEL-QUOTE-DELAY-2000
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - otel-demo-lab
    labelSelectors:
      app: quote
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
  duration: 30s
  direction: to
