apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: otel-payment-loss-one
  namespace: otel-demo-lab
spec:
  action: loss
  mode: one
  selector:
    namespaces:
      - otel-demo-lab
    labelSelectors:
      app: payment
  loss:
    loss: "100"
    correlation: "100"
  duration: "15s"
  direction: to
