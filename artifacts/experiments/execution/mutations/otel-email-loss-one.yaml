apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eval-otel-email-loss-one
  namespace: otel-demo-lab
  labels:
    chaos.evaluation: deep-matrix
spec:
  action: loss
  mode: one
  selector:
    namespaces:
      - otel-demo-lab
    labelSelectors:
      app: email
  loss:
    loss: "100"
    correlation: "100"
  duration: "15s"
  direction: to
