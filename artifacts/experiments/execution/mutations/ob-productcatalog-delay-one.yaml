apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ob-productcatalog-delay-one
  namespace: online-boutique-lab
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - online-boutique-lab
    labelSelectors:
      app: productcatalogservice
  delay:
    latency: "500ms"
    correlation: "100"
    jitter: "0ms"
  duration: "15s"
  direction: to
