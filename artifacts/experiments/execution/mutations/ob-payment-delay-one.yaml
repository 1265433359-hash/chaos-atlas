apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eval-ob-payment-delay-one
  namespace: online-boutique-lab
  labels:
    chaos.evaluation: track-k
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - online-boutique-lab
    labelSelectors:
      app: paymentservice
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
  duration: "30s"
  direction: to

