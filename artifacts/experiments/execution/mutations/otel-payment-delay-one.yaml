apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: otel-payment-delay-one
  namespace: otel-demo-lab
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - otel-demo-lab
    labelSelectors:
      app: payment
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
  duration: "15s"
  direction: to
