apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ob-checkout-delay-one
  namespace: online-boutique-lab
  labels:
    chaos.extended: candidate
    chaos.candidate-id: OB-CHECKOUT-DELAY-2000
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - online-boutique-lab
    labelSelectors:
      app: checkoutservice
  delay:
    latency: 2000ms
    correlation: '100'
    jitter: 0ms
  duration: 15s
  direction: to
