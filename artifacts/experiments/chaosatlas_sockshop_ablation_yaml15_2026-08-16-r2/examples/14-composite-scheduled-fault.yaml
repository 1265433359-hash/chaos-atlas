apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: yaml15-example
  namespace: target-namespace
spec:
  schedule: 40 6 * * *
  concurrencyPolicy: Forbid
  historyLimit: 5
  type: Workflow
  workflow:
    entry: e6
    templates:
    - name: e6
      templateType: Serial
      deadline: 10m
      children:
      - preflight-health
      - impair-and-watch
    - name: preflight-health
      templateType: StatusCheck
      deadline: 2m
      statusCheck:
        mode: Synchronous
        type: HTTP
        http:
          url: https://example.invalid/health
          method: GET
          criteria:
            statusCode: '200'
    - name: impair-and-watch
      templateType: Parallel
      deadline: 5m
      children:
      - dns-fail-dependency
      - steady-state-during
    - name: dns-fail-dependency
      templateType: DNSChaos
      deadline: 2m
      dnsChaos:
        action: error
        mode: one
        selector:
          namespaces:
          - target-namespace
          labelSelectors:
            app: target-workload
        patterns:
        - example.invalid
    - name: steady-state-during
      templateType: StatusCheck
      deadline: 4m
      statusCheck:
        mode: Continuous
        type: HTTP
        duration: 3m
        intervalSeconds: 2
        failureThreshold: 5
        recordsHistoryLimit: 100
        http:
          url: https://example.invalid/health
          method: GET
          criteria:
            statusCode: '200'
