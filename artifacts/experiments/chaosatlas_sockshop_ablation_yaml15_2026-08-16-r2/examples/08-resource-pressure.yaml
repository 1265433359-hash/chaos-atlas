apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: yaml15-example
  namespace: target-namespace
  labels:
    app: target-workload
    component: target-workload
spec:
  mode: one
  selector:
    namespaces:
    - target-namespace
    labelSelectors:
      app: target-workload
  stressors:
    cpu:
      workers: 2
      load: 85
  duration: 5m
