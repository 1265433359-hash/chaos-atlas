apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: yaml15-example
  namespace: target-namespace
spec:
  entry: serial-app-test
  templates:
  - name: serial-app-test
    templateType: Serial
    deadline: 1h
    children:
    - latency-injection
    - error-injection
    - recovery-test
  - name: latency-injection
    templateType: HTTPChaos
    deadline: 20m
    httpChaos:
      selector:
        namespaces:
        - target-namespace
        labelSelectors:
          app: target-workload
      mode: one
      action: delay
      delay: 300ms
      percent: '25'
      target: Service
      port: 8080
  - name: error-injection
    templateType: HTTPChaos
    deadline: 20m
    httpChaos:
      selector:
        namespaces:
        - target-namespace
        labelSelectors:
          app: target-workload
      mode: one
      action: abort
      target: Service
      port: 8080
      percent: '10'
  - name: recovery-test
    templateType: PodChaos
    deadline: 10m
    podChaos:
      selector:
        namespaces:
        - target-namespace
        labelSelectors:
          app: target-workload
      mode: one
      action: pod-failure
