apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: yaml15-example
  namespace: target-namespace
  labels:
    app: target-workload
    component: target-workload
spec:
  mode: one
  selector:
    namespaces:
    - target-namespace
    labelSelectors:
      app: target-workload
  stressors:
    memory:
      workers: 1
      size: 256MB
      options:
      - --vm-keep
  duration: 3m
