apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: yaml15-example
  namespace: target-namespace
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - target-namespace
    labelSelectors:
      app: target-workload
  scheduler:
    cron: '@every 2h'
  duration: 30s
