apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: teastore-webui-persistence-delay-2000
  namespace: heldout-teastore-lab
  labels:
    chaos.heldout.candidate-id: TEASTORE-webui-persistence-DELAY-2000
    chaos.heldout.project: TEASTORE
    chaos.heldout.stage: d
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - heldout-teastore-lab
    labelSelectors:
      app: persistence
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
  duration: "30s"
  direction: to
