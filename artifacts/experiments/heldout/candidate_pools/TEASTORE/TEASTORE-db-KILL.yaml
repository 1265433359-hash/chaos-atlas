apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: teastore-db-kill
  namespace: heldout-teastore-lab
  labels:
    chaos.heldout.candidate-id: TEASTORE-db-KILL
    chaos.heldout.project: TEASTORE
    chaos.heldout.stage: d
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - heldout-teastore-lab
    labelSelectors:
      app: db
  duration: "30s"
