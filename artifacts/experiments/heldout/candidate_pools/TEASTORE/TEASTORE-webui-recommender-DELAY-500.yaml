apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: teastore-webui-recommender-delay-500
  namespace: heldout-teastore-lab
  labels:
    chaos.heldout.candidate-id: TEASTORE-webui-recommender-DELAY-500
    chaos.heldout.project: TEASTORE
    chaos.heldout.stage: d
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - heldout-teastore-lab
    labelSelectors:
      app: recommender
  delay:
    latency: "500ms"
    correlation: "100"
    jitter: "0ms"
  duration: "30s"
  direction: to
