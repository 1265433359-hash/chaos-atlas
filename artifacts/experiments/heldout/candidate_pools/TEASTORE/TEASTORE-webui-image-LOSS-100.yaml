apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: teastore-webui-image-loss-100
  namespace: heldout-teastore-lab
  labels:
    chaos.heldout.candidate-id: TEASTORE-webui-image-LOSS-100
    chaos.heldout.project: TEASTORE
    chaos.heldout.stage: d
spec:
  action: loss
  mode: one
  selector:
    namespaces:
      - heldout-teastore-lab
    labelSelectors:
      app: image
  loss:
    loss: "100"
    correlation: "100"
  duration: "30s"
  direction: to
