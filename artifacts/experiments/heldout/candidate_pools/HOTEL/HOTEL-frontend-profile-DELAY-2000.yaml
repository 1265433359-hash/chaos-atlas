apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: hotel-frontend-profile-delay-2000
  namespace: heldout-hotel-lab
  labels:
    chaos.heldout.candidate-id: HOTEL-frontend-profile-DELAY-2000
    chaos.heldout.project: HOTEL
    chaos.heldout.stage: d
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - heldout-hotel-lab
    labelSelectors:
      app: profile
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
  duration: "30s"
  direction: to
