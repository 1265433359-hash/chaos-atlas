apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: chaosatlas-p02
spec:
  template:
    spec:
      containers:
        - name: config-server
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: native
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
              value: file:/config-repo
          volumeMounts:
            - name: config-repo
              mountPath: /config-repo
              readOnly: true
      volumes:
        - name: config-repo
          configMap:
            name: p02-config-repo
