apiVersion: v1
kind: Pod
metadata:
  name: dns-probe
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: probe
    image: alpine:3.22
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-c"]
    args:
    - "apk add --no-cache bind-tools >/dev/null 2>&1 && nslookup kubernetes.default.svc.cluster.local && nslookup kube-dns.kube-system.svc.cluster.local"
