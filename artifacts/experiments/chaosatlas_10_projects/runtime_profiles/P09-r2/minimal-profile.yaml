apiVersion: v1
kind: Namespace
metadata:
  name: chaosatlas-p09
  labels:
    chaosatlas.io/profile: minimal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p09-app-storage
  namespace: chaosatlas-p09
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p09-env
  namespace: chaosatlas-p09
data:
  DB_TYPE: postgresql
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USERNAME: postgres
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  REDIS_USE_SSL: 'false'
  CELERY_BROKER_URL: redis://redis:6379/1
  EVENT_BUS_REDIS_URL: redis://redis:6379/1
  VECTOR_STORE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: storage
  ETL_TYPE: dify
  DIFY_BIND_ADDRESS: 0.0.0.0
  DIFY_PORT: '5001'
  MODE: api
  MIGRATION_ENABLED: 'true'
  DEBUG: 'false'
  FLASK_DEBUG: 'false'
  MARKETPLACE_ENABLED: 'false'
  ENABLE_COLLABORATION_MODE: 'false'
  ALLOW_REGISTER: 'false'
  ALLOW_CREATE_WORKSPACE: 'false'
  ENABLE_WEBSITE_JINAREADER: 'false'
  ENABLE_WEBSITE_FIRECRAWL: 'false'
  ENABLE_WEBSITE_WATERCRAWL: 'false'
  CODE_EXECUTION_ENDPOINT: ''
  SSRF_PROXY_HTTP_URL: ''
  SSRF_PROXY_HTTPS_URL: ''
  AGENT_BACKEND_BASE_URL: ''
  PLUGIN_REMOTE_INSTALL_HOST: ''
  PLUGIN_REMOTE_INSTALL_PORT: '0'
  PLUGIN_DIFY_INNER_API_KEY: ''
  DIFY_AGENT_API_TOKEN: ''
  OPENAI_API_BASE: ''
  OPENAI_API_KEY: ''
  CONSOLE_API_URL: http://web:3000
  SERVER_CONSOLE_API_URL: http://api:5001
  APP_API_URL: http://api:5001
---
apiVersion: v1
kind: Secret
metadata:
  name: p09-secrets
  namespace: chaosatlas-p09
type: Opaque
stringData:
  DB_PASSWORD: REPLACE_BEFORE_APPLY
  POSTGRES_PASSWORD: REPLACE_BEFORE_APPLY
  REDIS_PASSWORD: REPLACE_BEFORE_APPLY
  SECRET_KEY: REPLACE_BEFORE_APPLY
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-permissions
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: init-permissions
    chaosatlas.io/profile: minimal
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: chaosatlas-p09
        app.kubernetes.io/name: init-permissions
        chaosatlas.io/profile: minimal
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: init-permissions
        image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        command:
        - sh
        - -c
        - mkdir -p /app/api/storage && chown -R 1001:1001 /app/api/storage && touch
          /app/api/storage/.init_permissions
        volumeMounts:
        - name: app-storage
          mountPath: /app/api/storage
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: p09-app-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: api
    chaosatlas.io/profile: minimal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: chaosatlas-p09
        app.kubernetes.io/name: api
        chaosatlas.io/profile: minimal
    spec:
      automountServiceAccountToken: false
      containers:
      - name: api
        image: langgenius/dify-api@sha256:dcefa5f7c47c77e621f5b864bc1d64a2ba18cd215b001f15b3882bb7911c6c64
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        envFrom:
        - configMapRef:
            name: p09-env
        - secretRef:
            name: p09-secrets
        env:
        - name: MODE
          value: api
        ports:
        - name: http
          containerPort: 5001
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 60
          periodSeconds: 20
        volumeMounts:
        - name: app-storage
          mountPath: /app/api/storage
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: p09-app-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: worker
    chaosatlas.io/profile: minimal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: chaosatlas-p09
        app.kubernetes.io/name: worker
        chaosatlas.io/profile: minimal
    spec:
      automountServiceAccountToken: false
      containers:
      - name: worker
        image: langgenius/dify-api@sha256:dcefa5f7c47c77e621f5b864bc1d64a2ba18cd215b001f15b3882bb7911c6c64
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        envFrom:
        - configMapRef:
            name: p09-env
        - secretRef:
            name: p09-secrets
        env:
        - name: MODE
          value: worker
        volumeMounts:
        - name: app-storage
          mountPath: /app/api/storage
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: p09-app-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-beat
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: worker-beat
    chaosatlas.io/profile: minimal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: chaosatlas-p09
        app.kubernetes.io/name: worker-beat
        chaosatlas.io/profile: minimal
    spec:
      automountServiceAccountToken: false
      containers:
      - name: worker-beat
        image: langgenius/dify-api@sha256:dcefa5f7c47c77e621f5b864bc1d64a2ba18cd215b001f15b3882bb7911c6c64
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        envFrom:
        - configMapRef:
            name: p09-env
        - secretRef:
            name: p09-secrets
        env:
        - name: MODE
          value: beat
        volumeMounts:
        - name: app-storage
          mountPath: /app/api/storage
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: p09-app-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: web
    chaosatlas.io/profile: minimal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: chaosatlas-p09
        app.kubernetes.io/name: web
        chaosatlas.io/profile: minimal
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: langgenius/dify-web@sha256:87dd47e4e28f86834f6a7aefd9a02b9f4097056867031e4d99ebd46908a0e390
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        envFrom:
        - configMapRef:
            name: p09-env
        - secretRef:
            name: p09-secrets
        env:
        - name: SERVER_CONSOLE_API_URL
          value: http://api:5001
        ports:
        - name: http
          containerPort: 3000
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: postgres
    chaosatlas.io/profile: minimal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: chaosatlas-p09
        app.kubernetes.io/name: postgres
        chaosatlas.io/profile: minimal
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        envFrom:
        - configMapRef:
            name: p09-env
        - secretRef:
            name: p09-secrets
        env:
        - name: POSTGRES_DB
          value: dify
        - name: POSTGRES_USER
          value: postgres
        ports:
        - name: postgres
          containerPort: 5432
        command:
        - postgres
        - -c
        - max_connections=100
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - dify
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: postgres
    chaosatlas.io/profile: minimal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: tcp
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: redis
    chaosatlas.io/profile: minimal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: chaosatlas-p09
        app.kubernetes.io/name: redis
        chaosatlas.io/profile: minimal
    spec:
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: redis@sha256:ec5e187c913d422cdf60f4216a5fdfb95246792c6de6fe21ff5bed75cbfc8c23
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        envFrom:
        - configMapRef:
            name: p09-env
        - secretRef:
            name: p09-secrets
        env: []
        ports:
        - name: redis
          containerPort: 6379
        command:
        - redis-server
        - --appendonly
        - 'yes'
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: redis
    chaosatlas.io/profile: minimal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
  - name: tcp
    port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: api
    chaosatlas.io/profile: minimal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
  - name: http
    port: 5001
    targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chaosatlas-p09
  labels:
    app.kubernetes.io/part-of: chaosatlas-p09
    app.kubernetes.io/name: web
    chaosatlas.io/profile: minimal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
  - name: tcp
    port: 3000
    targetPort: 3000
