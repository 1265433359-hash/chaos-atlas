apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eval-eshop-mobile-bff-catalog-api-delay
  namespace: heldout-eshop-lab
  labels:
    chaos.evaluation: track-k
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - heldout-eshop-lab
    labelSelectors:
      app: Catalog.API
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
  duration: "30s"
  direction: to
