apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eval-socialnet-home-timeline-social-graph-delay
  namespace: heldout-socialnet-lab
  labels:
    chaos.evaluation: track-k
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - heldout-socialnet-lab
    labelSelectors:
      app: social-graph
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
  duration: "30s"
  direction: to
