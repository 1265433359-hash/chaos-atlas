apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eval-socialnet-compose-post-unique-id-loss
  namespace: heldout-socialnet-lab
  labels:
    chaos.evaluation: track-k
spec:
  action: loss
  mode: one
  selector:
    namespaces:
      - heldout-socialnet-lab
    labelSelectors:
      app: unique-id
  loss:
    loss: "100"
    correlation: "100"
  duration: "30s"
  direction: to
