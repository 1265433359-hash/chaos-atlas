---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-master
  labels:
    name: queue-master
    project: chaos-eater
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      name: queue-master
  template:
    metadata:
      labels:
        name: queue-master
    spec:
      containers:
      - name: queue-master
        image: weaveworksdemos/queue-master:0.3.1
        env:
        - name: JAVA_OPTS
          value: -Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom
            -Dspring.zipkin.enabled=false
        resources:
          limits:
            memory: 512Mi
            cpu: 1000m
          requests:
            cpu: 100m
            memory: 300Mi
        ports:
        - containerPort: 80
        imagePullPolicy: IfNotPresent
      nodeSelector:
        beta.kubernetes.io/os: linux
