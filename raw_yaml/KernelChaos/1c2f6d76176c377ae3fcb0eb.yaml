apiVersion: chaos-mesh.org/v1alpha1
kind: KernelChaos
metadata:
  name: kernel-panic-simulation
  namespace: query-engines
spec:
  action: fail-kern
  mode: one
  selector:
    namespaces:
    - query-engines
    labelSelectors:
      app.kubernetes.io/name: clickhouse
  failKernRequest:
    callchain:
    - funcname: do_exit
    failtype: 0
  duration: 10s
  scheduler:
    cron: '@every 40m'
