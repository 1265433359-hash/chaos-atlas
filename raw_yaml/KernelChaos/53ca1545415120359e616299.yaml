apiVersion: chaos-mesh.org/v1alpha1
kind: KernelChaos
metadata:
  name: kernel-chaos-experiment
  namespace: qbitel
spec:
  mode: one
  selector:
    namespaces:
    - qbitel
    labelSelectors:
      app: qbitel
  failKernRequest:
    callchain:
    - funcname: should_failslab
    failtype: 0
  duration: 1m
