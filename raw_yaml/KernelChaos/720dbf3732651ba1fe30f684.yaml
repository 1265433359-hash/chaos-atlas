apiVersion: chaos-mesh.org/v1alpha1
kind: KernelChaos
metadata:
  name: kernel-panic
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
    - production
    labelSelectors:
      chaos-testing: enabled
  failKernRequest:
    failtype: 0
    headers:
    - Accept
    probability: 10
  duration: 1m
