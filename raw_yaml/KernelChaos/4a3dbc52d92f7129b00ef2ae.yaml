apiVersion: chaos-mesh.org/v1alpha1
kind: KernelChaos
metadata:
  name: kernel-failure
  namespace: chaos-testing
spec:
  mode: one
  duration: 2m
  selector:
    namespaces:
    - skalean-system
    labelSelectors:
      critical: 'true'
  failKernRequest:
    callchain:
    - funcname: sys_read
      parameters:
        probability: 10
        times: 3
    failtype: 0
  scheduler:
    cron: '@every 12h'
