apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: auth-to-identity-delay
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - circleguard-stage
    labelSelectors:
      app: auth-service
  delay:
    latency: 500ms
    jitter: 100ms
    correlation: '25'
  direction: to
  target:
    selector:
      namespaces:
      - circleguard-stage
      labelSelectors:
        app: identity-service
  duration: 5m
