apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: bandwidth-limit
  namespace: chaos-mesh
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
    - nebula-production
    labelSelectors:
      app: api
  bandwidth:
    rate: 1mbps
    limit: 20000
    buffer: 10000
  duration: 3m
