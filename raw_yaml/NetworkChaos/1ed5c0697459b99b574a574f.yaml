apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: aiflow-dns-failure
  namespace: agents-staging
spec:
  action: partition
  mode: all
  selector:
    namespaces:
    - agents-staging
    labelSelectors:
      app: aiflow-social-agent
  direction: to
  target:
    selector:
      namespaces:
      - kube-system
      labelSelectors:
        k8s-app: kube-dns
  duration: 1m
