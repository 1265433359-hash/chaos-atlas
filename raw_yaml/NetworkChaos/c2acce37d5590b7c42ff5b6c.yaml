apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition-elite-scanner
  namespace: elevatediq-production
  labels:
    app.kubernetes.io/name: chaos-experiment
    app.kubernetes.io/component: network-partition
spec:
  action: partition
  mode: all
  selector:
    namespaces:
    - elevatediq-production
    labelSelectors:
      app.kubernetes.io/name: elite-scanner
  direction: both
  target:
    selector:
      namespaces:
      - elevatediq-production
      labelSelectors:
        app.kubernetes.io/name: ml-forecasting
    mode: all
  duration: 60s
  scheduler:
    cron: '@every 24h'
