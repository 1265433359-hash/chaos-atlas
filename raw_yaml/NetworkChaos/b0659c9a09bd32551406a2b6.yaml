apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-chaos
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - default
    labelSelectors:
      app: cloudmine-backend
  delay:
    latency: 100ms
    correlation: '100'
    jitter: 0ms
  duration: 30s
  scheduler:
    cron: '@every 10m'
