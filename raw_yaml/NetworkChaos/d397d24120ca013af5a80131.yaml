apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: dns-failure-test
  namespace: estatewise
spec:
  action: loss
  mode: one
  selector:
    namespaces:
    - estatewise
    labelSelectors:
      app: estatewise-backend
  loss:
    loss: '50'
    correlation: '50'
  duration: 1m
  direction: to
  externalTargets:
  - kube-dns.kube-system.svc.cluster.local
