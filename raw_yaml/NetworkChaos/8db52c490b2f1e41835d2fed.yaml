apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: aiflow-network-delay
  namespace: agents-staging
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - agents-staging
    labelSelectors:
      app: aiflow-social-agent
  delay:
    latency: 500ms
    correlation: '50'
    jitter: 100ms
  duration: 2m
  direction: to
