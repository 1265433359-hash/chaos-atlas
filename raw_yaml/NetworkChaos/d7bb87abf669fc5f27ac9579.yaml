apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: rabbitmq-consumer-network-delay
  namespace: chaos-testing
spec:
  action: delay
  mode: fixed-percent
  value: '30'
  selector:
    namespaces:
    - rabbitmq
    labelSelectors:
      app: rabbitmq-consumer
  duration: 5m
  scheduler:
    cron: '@every 20m'
  networkDelay:
    latency: 500ms
    correlation: '100'
    jitter: 100ms
