apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition-test
  namespace: chaos-testing
  labels:
    experiment: resilience
    type: network-partition
spec:
  action: partition
  mode: all
  selector:
    namespaces:
    - app-team-a-dev
    labelSelectors:
      app: api-gateway
  direction: both
  target:
    selector:
      namespaces:
      - app-team-a-dev
      labelSelectors:
        app: order-service
  duration: 2m
