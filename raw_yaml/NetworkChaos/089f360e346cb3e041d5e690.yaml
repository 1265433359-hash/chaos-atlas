apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: hotel-booking-f06-db-slow
  namespace: vibe-coding
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - vibe-coding
    labelSelectors:
      app: hotel-booking
  direction: both
  target:
    mode: all
    selector:
      namespaces:
      - vibe-coding
      labelSelectors:
        app: postgres
  delay:
    latency: 3000ms
    correlation: '0'
    jitter: 0ms
  duration: 150s
