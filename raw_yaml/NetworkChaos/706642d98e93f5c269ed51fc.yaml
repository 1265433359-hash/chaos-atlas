apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: auth-service-network-latency
  namespace: chaos-engineering
  labels:
    experiment-type: network-latency
    target-service: auth-service
    severity: medium
    automation: enabled
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - rust-security-dev
    labelSelectors:
      app: auth-service
  delay:
    latency: 200ms
    correlation: '25'
    jitter: 10ms
  duration: 5m
  scheduler:
    cron: '@weekly'
    historyLimit: 5
