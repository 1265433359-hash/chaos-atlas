apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay
  namespace: chaos-mesh
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - nebula-production
    labelSelectors:
      app: api
  delay:
    latency: 100ms
    correlation: '25'
    jitter: 10ms
  duration: 5m
  scheduler:
    cron: '@every 2h'
