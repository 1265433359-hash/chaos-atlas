apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: redis-cluster-network-partition
  namespace: chaos-testing
spec:
  action: partition
  mode: fixed-percent
  value: '50'
  selector:
    namespaces:
    - redis
    labelSelectors:
      app: redis-cluster
  duration: 3m
  scheduler:
    cron: '@every 25m'
  networkDelay:
    latency: 200ms
    correlation: '100'
    jitter: 50ms
