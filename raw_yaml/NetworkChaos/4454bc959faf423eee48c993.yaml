apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: k6-load-network-latency
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: chaos-test
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - securerag-hub
    labelSelectors:
      app.kubernetes.io/part-of: securerag-hub
  delay:
    latency: 200ms
    correlation: '50'
    jitter: 20ms
  duration: 5m
  direction: to
