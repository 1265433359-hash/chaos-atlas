apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-latency-moderate
  namespace: dashly
  labels:
    experiment: network-latency
    severity: moderate
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - dashly
    labelSelectors:
      app: api
      version: stable
  delay:
    latency: 200ms
    correlation: '25'
    jitter: 50ms
  duration: 120s
