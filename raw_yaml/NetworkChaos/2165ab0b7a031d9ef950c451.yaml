apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: mrc-latency-
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - dc1
    - dc2
    labelSelectors:
      clusterId: dc2
  delay:
    latency: 10ms
    correlation: '100'
    jitter: 0ms
  duration: 30s
  scheduler:
    cron: '@every 60s'
