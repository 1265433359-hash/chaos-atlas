apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - staging
    labelSelectors:
      app: frontend
  delay:
    latency: 500ms
    correlation: '100'
    jitter: 0ms
  duration: 5m
