apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: pesitwizard-packet-loss
  namespace: staging
  labels:
    app: pesitwizard
    chaos-type: packet-loss
spec:
  action: loss
  mode: all
  selector:
    namespaces:
    - staging
    labelSelectors:
      app: pesitwizard-server
  loss:
    loss: '10'
    correlation: '50'
  duration: 5m
