apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-latency-test
  namespace: production
  annotations:
    description: Add network latency to database connections
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - production
    labelSelectors:
      app: user-service
  delay:
    latency: 500ms
    correlation: '25'
    jitter: 100ms
  direction: to
  target:
    mode: all
    selector:
      namespaces:
      - production
      labelSelectors:
        app: postgresql
  duration: 10m
