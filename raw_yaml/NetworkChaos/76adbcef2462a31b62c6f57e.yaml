apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: db-partition
  namespace: llmchat
spec:
  action: partition
  mode: all
  selector:
    namespaces:
    - llmchat
    labelSelectors:
      app: llmchat-backend
  direction: to
  target:
    mode: all
    selector:
      namespaces:
      - llmchat
      labelSelectors:
        app: postgres
  duration: 2m
