apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-right-arm
spec:
  action: delay
  direction: to
  mode: one
  selector:
    labelSelectors:
      component: podtato-head-right-arm
  target:
    mode: all
    selector:
      labelSelectors:
        component: podtato-head-entry
  delay:
    latency: 400ms
    correlation: '100'
    jitter: 0ms
