apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: api-redis-partition
  namespace: baalvion
spec:
  action: partition
  mode: all
  selector:
    namespaces:
    - baalvion
    labelSelectors:
      app: api
  direction: to
  target:
    mode: all
    selector:
      namespaces:
      - baalvion
      labelSelectors:
        app: redis
  duration: 3m
