apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: epic8-network-latency-test
  namespace: epic8-prod
  labels:
    epic8.platform/experiment: network-latency
    epic8.platform/component: chaos-engineering
    epic8.platform/validation: slo-compliance
spec:
  action: delay
  mode: all
  duration: 240s
  delay:
    latency: 100ms
    correlation: '100'
    jitter: 10ms
  direction: to
  selector:
    namespaces:
    - epic8-prod
    labelSelectors:
      epic8.platform/tier: data
  target:
    mode: all
    selector:
      namespaces:
      - epic8-prod
      labelSelectors:
        epic8.platform/tier: compute
