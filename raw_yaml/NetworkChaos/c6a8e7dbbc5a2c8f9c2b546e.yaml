apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: full-network-partition
  namespace: elevatediq-production
  labels:
    app.kubernetes.io/name: chaos-experiment
    app.kubernetes.io/component: network-partition
spec:
  action: partition
  mode: one
  selector:
    namespaces:
    - elevatediq-production
    labelSelectors:
      app.kubernetes.io/part-of: elevatediq
  direction: both
  target:
    selector:
      namespaces:
      - elevatediq-production
      labelSelectors:
        app.kubernetes.io/component: monitoring
    mode: all
  duration: 30s
