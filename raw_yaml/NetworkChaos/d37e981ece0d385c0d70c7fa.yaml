apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-bandwidth-test
  namespace: chaos-testing
  labels:
    experiment: resilience
    type: network-bandwidth
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
    - app-team-a-dev
    labelSelectors:
      app: api-gateway
  bandwidth:
    rate: 1mbps
    limit: 20000
    buffer: 10000
  direction: both
  duration: 5m
