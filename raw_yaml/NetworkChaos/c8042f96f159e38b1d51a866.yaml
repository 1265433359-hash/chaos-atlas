apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: slow-consumer
  namespace: agentauth
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - agentauth
    labelSelectors:
      app: registry
  delay:
    latency: 5000ms
    correlation: '100'
  direction: to
  target:
    selector:
      namespaces:
      - agentauth
      labelSelectors:
        app: postgresql
    mode: all
  duration: 5m
