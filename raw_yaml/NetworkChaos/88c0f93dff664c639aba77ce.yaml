apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: template-write-latency
  namespace: chaos-experiments
  labels:
    template: write-heavy
    severity: medium
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      component: database
  mode: all
  action: delay
  delay:
    latency: 500ms
  direction: both
  duration: 5m
