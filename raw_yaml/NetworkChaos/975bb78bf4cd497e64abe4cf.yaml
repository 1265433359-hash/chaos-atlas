apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-bandwidth
  namespace: security-monitor
spec:
  action: bandwidth
  mode: one
  selector:
    namespaces:
    - security-monitor
    labelSelectors:
      app: security-monitor
  bandwidth:
    rate: 1mbps
    limit: 20000
    buffer: 10000
  duration: 5m
  direction: to
