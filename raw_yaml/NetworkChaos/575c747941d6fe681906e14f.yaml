apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: template-database-latency
  namespace: chaos-experiments
  labels:
    template: database-resilience
    severity: critical
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      tier: database
  mode: all
  action: delay
  delay:
    latency: 200ms
    jitter: 50ms
  direction: both
  duration: 10m
