apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-profile
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - beans
    labelSelectors:
      app: profile
  delay:
    latency: 500ms
    correlation: '100'
    jitter: 100ms
  duration: 1m
