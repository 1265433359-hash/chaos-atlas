apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-packet-loss
  namespace: query-engines
spec:
  action: loss
  mode: one
  selector:
    namespaces:
    - query-engines
    labelSelectors:
      app.kubernetes.io/name: clickhouse
  loss:
    loss: '10'
    correlation: '25'
  duration: 30s
  scheduler:
    cron: '@every 15m'
