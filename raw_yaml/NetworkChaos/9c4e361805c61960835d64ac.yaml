apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: api-bandwidth-limit
  namespace: chaos-testing
  labels:
    app: ml-scheduler
    experiment: bandwidth
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
    - ml-scheduler
    labelSelectors:
      app: api
  bandwidth:
    rate: 1mbps
    limit: 100
    buffer: 10000
  direction: to
  duration: 120s
