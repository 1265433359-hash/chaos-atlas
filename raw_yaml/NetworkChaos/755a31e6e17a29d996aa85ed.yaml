apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition
  namespace: chaos-testing
  labels:
    experiment: network-partition
    severity: critical
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      tier: backend
  mode: all
  action: partition
  direction: both
  target:
    selector:
      namespaces:
      - production
      labelSelectors:
        tier: database
  duration: 5m
