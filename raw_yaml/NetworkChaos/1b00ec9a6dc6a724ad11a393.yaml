apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: asymmetric-delay-outgoing
  namespace: security-monitor
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - security-monitor
    labelSelectors:
      app: security-monitor
  delay:
    latency: 50ms
  duration: 5m
  direction: to
