apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: template-service-partition
  namespace: chaos-experiments
  labels:
    template: network-partition
    severity: critical
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      zone: primary
  mode: all
  action: partition
  direction: both
  target:
    selector:
      namespaces:
      - production
      labelSelectors:
        zone: secondary
  duration: 3m
