apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-experiment
  namespace: qbitel
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - qbitel
    labelSelectors:
      app: qbitel
  delay:
    latency: 100ms
    correlation: '25'
    jitter: 10ms
  duration: 5m
  direction: to
  target:
    mode: all
    selector:
      namespaces:
      - qbitel
