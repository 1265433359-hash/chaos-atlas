apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition-test
  namespace: trading-bot
spec:
  action: partition
  mode: one
  selector:
    namespaces:
    - trading-bot
    labelSelectors:
      app: trading-bot-api
  direction: to
  target:
    mode: one
    selector:
      namespaces:
      - trading-bot
      labelSelectors:
        app: postgres
  duration: 2m
  scheduler:
    cron: 0 3 * * 0
