apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-duplicate
  namespace: security-monitor
spec:
  action: duplicate
  mode: one
  selector:
    namespaces:
    - security-monitor
    labelSelectors:
      app: security-monitor
  duplicate:
    duplicate: '20'
    correlation: '0'
  duration: 3m
