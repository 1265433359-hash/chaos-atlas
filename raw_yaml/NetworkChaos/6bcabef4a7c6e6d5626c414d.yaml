apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-example3
  namespace: default
spec:
  action: delay
  mode: one
  selector:
    pods:
      default:
      - ubuntu-pod
  delay:
    latency: 100ms
    correlation: '0'
    jitter: 0ms
  duration: 30s
  direction: to
