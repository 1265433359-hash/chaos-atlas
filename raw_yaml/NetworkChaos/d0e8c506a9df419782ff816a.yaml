apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: mesh-latency-injection
  namespace: x0tta6bl4
  labels:
    chaos-scenario: latency-injection
spec:
  action: delay
  mode: one
  selector:
    labelSelectors:
      app: x0tta6bl4-node
  delay:
    latency: 100ms
    correlation: '100'
    reorder:
      reorder: '0'
      correlation: '0'
    gap: '0'
  duration: 30s
  scheduler:
    cron: '@every 5m'
