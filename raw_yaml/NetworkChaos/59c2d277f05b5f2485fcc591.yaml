apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: aiflow-buildkit-partition
  namespace: agents-staging
spec:
  action: partition
  mode: all
  selector:
    namespaces:
    - agents-staging
    labelSelectors:
      app: aiflow-social-agent
  direction: to
  target:
    selector:
      namespaces:
      - agent-buildkit
      labelSelectors:
        app: buildkit-registry
  duration: 1m
