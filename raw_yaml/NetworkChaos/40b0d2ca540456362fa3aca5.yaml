apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-latency-injection
  namespace: default
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - default
    labelSelectors:
      app: event-ingestion-service
  delay:
    latency: 300ms
    correlation: '50'
    jitter: 50ms
  duration: 5m
  scheduler:
    cron: '@every 6h'
