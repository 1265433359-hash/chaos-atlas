apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: provider-network-partition
  namespace: chaos-testing
spec:
  action: partition
  mode: all
  selector:
    namespaces:
    - inference-gateway
    labelSelectors:
      app: anthropic-provider
  duration: 15m
  direction: both
  target:
    mode: all
    selector:
      namespaces:
      - inference-gateway
      labelSelectors:
        app: gateway-service
  scheduler:
    cron: 0 */6 * * *
