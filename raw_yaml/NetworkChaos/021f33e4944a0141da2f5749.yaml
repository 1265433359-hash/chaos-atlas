apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-example
  namespace: chaos-mesh
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - moodify-staging
    labelSelectors:
      app: moodify
      component: backend
  delay:
    latency: 100ms
    correlation: '100'
    jitter: 0ms
  duration: 5m
  scheduler:
    cron: '@every 4h'
