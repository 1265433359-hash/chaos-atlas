apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: database-network-partition
  namespace: chaos-testing
spec:
  action: partition
  mode: one
  selector:
    namespaces:
    - elevatediq
    labelSelectors:
      app: cloudsql-proxy
  direction: to
  target:
    mode: one
    selector:
      namespaces:
      - elevatediq
      labelSelectors:
        app: portal-backend
  duration: 1m
  scheduler:
    cron: 0 2 * * 0
