apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: rabbitmq-latency
  namespace: final-project
spec:
  action: delay
  mode: one
  selector:
    labelSelectors:
      app.kubernetes.io/instance: rabbitmq
  delay:
    latency: 200ms
    correlation: '100'
    jitter: 50ms
  duration: 5m
  scheduler:
    cron: '@every 10m'
