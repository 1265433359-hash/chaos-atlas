apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: backend-network-delay
  namespace: default
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: backend
  delay:
    latency: 500ms
    correlation: '50'
    jitter: 100ms
  duration: 60s
  scheduler:
    cron: '@every 10m'
