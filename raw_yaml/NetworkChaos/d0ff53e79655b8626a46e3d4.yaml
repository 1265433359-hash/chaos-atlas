apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-loss-test
  namespace: chaos-testing
spec:
  action: loss
  mode: one
  selector:
    namespaces:
    - self-healing-prod
    labelSelectors:
      app: data-service
  loss:
    loss: '10'
    correlation: '25'
  duration: 3m
  scheduler:
    cron: '@every 25m'
