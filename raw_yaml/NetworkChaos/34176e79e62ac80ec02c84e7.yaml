apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: simple-network-delay
  namespace: chaos-mesh
  annotations:
    chaos.alpha.kubernetes.io/experiment: basic-network-delay
spec:
  action: delay
  mode: one
  duration: 60s
  selector:
    namespaces:
    - chaos-sandbox
    labelSelectors:
      app: backend-api
  delay:
    latency: 500ms
    correlation: '90'
    jitter: 100ms
  direction: both
