apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: service-a-v2-latency
  namespace: canary-playground
spec:
  action: delay
  mode: all
  selector:
    labelSelectors:
      app: service-a
      version: v2
  delay:
    latency: 250ms
    correlation: '50'
    jitter: 50ms
  duration: 1m
  scheduler:
    cron: '*/10 * * * *'
