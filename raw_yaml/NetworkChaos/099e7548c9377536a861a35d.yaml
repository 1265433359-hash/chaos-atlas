apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-loss-inject
  namespace: chaos-testing
  labels:
    experiment: network-loss
    severity: high
spec:
  selector:
    namespaces:
    - production
    - staging
  mode: all
  action: loss
  loss:
    loss: '10'
    correlation: '50'
  direction: both
  duration: 5m
