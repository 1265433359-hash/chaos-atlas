apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: high-latency-scenario
  namespace: elevatediq-production
  labels:
    app.kubernetes.io/name: chaos-experiment
    app.kubernetes.io/component: network-latency
    scenario: high-latency
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - elevatediq-production
    labelSelectors:
      app.kubernetes.io/part-of: elevatediq
  delay:
    latency: 1000ms
    jitter: 200ms
    correlation: '75'
  direction: to
  target:
    selector:
      namespaces:
      - elevatediq-production
      labelSelectors:
        app.kubernetes.io/component: database
    mode: all
  duration: 60s
