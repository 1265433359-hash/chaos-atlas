apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: api-packet-loss
  namespace: chaos-testing
  labels:
    app: ml-scheduler
    experiment: packet-loss
spec:
  action: loss
  mode: all
  selector:
    namespaces:
    - ml-scheduler
    labelSelectors:
      app: api
  loss:
    loss: '10'
    correlation: '50'
  direction: both
  duration: 60s
