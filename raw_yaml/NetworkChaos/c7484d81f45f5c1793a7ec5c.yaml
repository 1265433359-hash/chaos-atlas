kind: NetworkChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: default
  name: network-loss
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: '{"apiVersion"'
spec:
  selector:
    namespaces:
    - default
    labelSelectors:
      app: ubuntu
  mode: one
  action: loss
  duration: 30s
  loss:
    loss: '80'
    correlation: '0'
  direction: to
