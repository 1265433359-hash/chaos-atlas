apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: remitflow-postgres-latency
  namespace: remitflow-staging
  labels:
    app.kubernetes.io/part-of: remitflow
    chaos-type: network
    target: postgres
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - remitflow-staging
    labelSelectors:
      app: postgres
  delay:
    latency: 500ms
    correlation: '50'
    jitter: 100ms
  duration: 5m
