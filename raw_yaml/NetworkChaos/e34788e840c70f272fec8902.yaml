apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: packet-loss-upf
  namespace: open5gs
spec:
  action: loss
  mode: all
  selector:
    namespaces:
    - open5gs
    labelSelectors:
      app.kubernetes.io/name: upf
      app.kubernetes.io/instance: open5gs
  loss:
    loss: '30'
    correlation: '25'
  duration: 5m
