apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: template-latency-cascade
  namespace: chaos-experiments
  labels:
    template: latency-cascade
    severity: high
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      tier: backend
  mode: all
  action: delay
  delay:
    latency: 300ms
    jitter: 100ms
  direction: both
  duration: 10m
