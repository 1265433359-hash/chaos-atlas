apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-latency
  namespace: query-engines
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - query-engines
    labelSelectors:
      app.kubernetes.io/name: presto
  delay:
    latency: 100ms
    correlation: '100'
    jitter: 0ms
  duration: 60s
  scheduler:
    cron: '@every 10m'
