apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: inventory-network-latency
  namespace: bitvelocity
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - bitvelocity
    labelSelectors:
      app: inventory-service
  delay:
    latency: 200ms
    correlation: '50'
    jitter: 50ms
  duration: 5m
  direction: to
  target:
    selector:
      namespaces:
      - bitvelocity
      labelSelectors:
        app: order-service
    mode: all
