apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: packet-loss
  namespace: chaos-testing
spec:
  action: loss
  mode: random-max-percent
  value: '25'
  duration: 10m
  selector:
    namespaces:
    - skalean-system
  loss:
    loss: '20'
    correlation: '25'
  scheduler:
    cron: '@every 2h'
