apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay
  namespace: llmchat
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - llmchat
    labelSelectors:
      app: llmchat-backend
  delay:
    latency: 100ms
    correlation: '100'
    jitter: 10ms
  duration: 5m
  scheduler:
    cron: '@every 1h'
