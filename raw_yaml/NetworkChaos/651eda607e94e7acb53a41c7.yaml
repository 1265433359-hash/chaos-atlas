apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition-test
  namespace: production
  annotations:
    description: Partition network between services
spec:
  action: partition
  mode: all
  selector:
    namespaces:
    - production
    labelSelectors:
      app: recommendation-engine
  direction: both
  target:
    mode: all
    selector:
      namespaces:
      - production
      labelSelectors:
        app: user-service
  duration: 2m
