apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-experiment
  namespace: estatewise
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - estatewise
    labelSelectors:
      app: backend
  delay:
    latency: 100ms
    correlation: '100'
    jitter: 10ms
  duration: 1m
  scheduler:
    cron: '@every 2h'
