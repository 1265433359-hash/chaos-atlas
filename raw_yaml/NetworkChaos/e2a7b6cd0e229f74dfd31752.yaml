apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-corrupt-inject
  namespace: chaos-testing
  labels:
    experiment: network-corruption
    severity: high
spec:
  selector:
    namespaces:
    - production
  mode: all
  action: corrupt
  corrupt:
    corrupt: '3'
    correlation: '50'
  direction: both
  duration: 2m
