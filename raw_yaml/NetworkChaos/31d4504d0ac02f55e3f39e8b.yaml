apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-latency
  namespace: cathedral
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - cathedral
    labelSelectors:
      app: cathedral-api
  delay:
    latency: 100ms
    correlation: '100'
    jitter: 0ms
  duration: 5m
