apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: portal-backend-network-delay
  namespace: chaos-testing
spec:
  action: delay
  mode: one
  selector:
    namespaces:
    - elevatediq
    labelSelectors:
      app: portal-backend
  delay:
    latency: 100ms
    correlation: '25'
    jitter: 10ms
  duration: 2m
  scheduler:
    cron: 0 */12 * * *
