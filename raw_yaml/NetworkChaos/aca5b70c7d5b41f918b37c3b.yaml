apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: employee-to-payroll-latency
  namespace: chaos-mesh
  labels:
    experiment: network-latency
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - employee-platform
    labelSelectors:
      app: employee-service
  delay:
    latency: 200ms
    correlation: '25'
    jitter: 50ms
  direction: to
  target:
    selector:
      namespaces:
      - employee-platform
      labelSelectors:
        app: payroll-service
    mode: all
  duration: 2m
