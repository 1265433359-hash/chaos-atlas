apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-bandwidth-experiment
  namespace: qbitel
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
    - qbitel
    labelSelectors:
      app: qbitel
  bandwidth:
    rate: 1mbps
    limit: 20000
    buffer: 10000
  duration: 3m
  direction: to
