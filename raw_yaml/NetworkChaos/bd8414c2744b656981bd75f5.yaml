apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: policy-service-delay
  namespace: stage10
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - stage10
    labelSelectors:
      app: decision-engine
  delay:
    latency: 2s
    correlation: '100'
  duration: 3m
  direction: to
  target:
    selector:
      namespaces:
      - stage9d
      labelSelectors:
        app: policy-engine
  scheduler:
    cron: '@every 2h'
