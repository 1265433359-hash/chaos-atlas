apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition
spec:
  action: partition
  mode: all
  selector:
    pods:
      default:
      - mysql-0
      - mysql-1
      - mysql-2
      - mysql-3
  direction: both
  target:
    mode: all
    selector:
      pods:
        default:
        - mysql-4
        - mysql-5
        - mysql-6
  duration: 300s
