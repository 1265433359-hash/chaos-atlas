apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-experiment
  namespace: chaos-testing
  labels:
    app: hospital-management-system
    component: chaos
spec:
  action: delay
  mode: all
  selector:
    namespaces:
    - ultimate-hms
    labelSelectors:
      app: hospital-management-system
  delay:
    latency: 100ms
    correlation: '25'
    jitter: 0ms
  duration: 60s
  scheduler:
    cron: '@every 12h'
