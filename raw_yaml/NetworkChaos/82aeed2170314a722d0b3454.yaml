apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: epic8-network-partition-test
  namespace: epic8-prod
  labels:
    epic8.platform/experiment: network-partition
    epic8.platform/component: chaos-engineering
spec:
  action: partition
  mode: fixed
  value: '1'
  duration: 180s
  direction: both
  selector:
    namespaces:
    - epic8-prod
    labelSelectors:
      epic8.platform/service: generator
  target:
    mode: fixed
    value: '1'
    selector:
      namespaces:
      - epic8-prod
      labelSelectors:
        epic8.platform/service: retriever
