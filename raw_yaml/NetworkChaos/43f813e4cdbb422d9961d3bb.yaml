apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition-test
  namespace: chaos-system
  labels:
    app: chaos-experiment
    scenario: basic-resilience
spec:
  action: partition
  mode: one
  duration: 5m
  scheduler:
    cron: 0 16 * * 2
  selector:
    namespaces:
    - pake-system
    labelSelectors:
      app: pake-api
    expressionSelectors:
    - key: chaos-test
      operator: In
      values:
      - enabled
  direction: to
  target:
    mode: one
    selector:
      namespaces:
      - database
      labelSelectors:
        app: pake-postgresql
