apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: redis-bandwidth-limit
  namespace: chaos-engineering
  labels:
    experiment-type: bandwidth-limit
    target-service: redis
    severity: medium
    automation: enabled
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
    - rust-security-dev
    labelSelectors:
      app: redis
  bandwidth:
    rate: 1mbps
    limit: 20971520
    buffer: 10000
  duration: 4m
  scheduler:
    cron: 0 3 * * 2
