apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-delay-experiment
  namespace: estatewise
spec:
  mode: one
  selector:
    namespaces:
    - estatewise
    labelSelectors:
      app: backend
  target: Request
  port: 5001
  method: POST
  path: /api/search
  delay: 500ms
  duration: 1m
  scheduler:
    cron: '@weekly'
