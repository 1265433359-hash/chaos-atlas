apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: service-latency-inject
  namespace: chaos-testing
  labels:
    experiment: http-chaos
    severity: medium
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: payment-processor
  mode: one
  action: delay
  delay: 500ms
  percent: '30'
  target: Service
  port: 8080
  path: /api/v1/payments
  methods:
  - POST
  - PUT
  duration: 10m
