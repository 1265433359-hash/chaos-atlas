apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-response-body-modify
  namespace: chaos-demo
spec:
  mode: all
  selector:
    namespaces:
    - chaos-demo
    labelSelectors:
      app: backend
  target: Response
  port: 5001
  path: /data*
  method: GET
  replace:
    body: '{"service":"backend","data":{"items":[],"total":0},"chaos":"injected","message":"Response
      modified by Chaos Mesh"}'
  duration: 3m
