apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-header-modify
  namespace: chaos-demo
spec:
  mode: all
  selector:
    namespaces:
    - chaos-demo
    labelSelectors:
      app: backend
  target: Response
  port: 5001
  replace:
    headers:
      X-Chaos-Injected: 'true'
      X-Debug-Info: chaos-mesh-experiment
  duration: 5m
