apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: service-mixed-errors
  namespace: chaos-testing
  labels:
    experiment: http-chaos
    severity: medium
spec:
  selector:
    namespaces:
    - production
  mode: all
  action: mixed
  delay: 100ms
  percent: '10'
  abortPercent: '5'
  target: Service
  port: 8080
  duration: 10m
