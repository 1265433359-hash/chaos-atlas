apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-delay-experiment
  namespace: chaos-mesh
spec:
  mode: all
  selector:
    namespaces:
    - microservices
    labelSelectors:
      app: api-gateway
  target: Request
  port: 8080
  method: GET
  path: /api/*
  delay: 3s
  duration: 5m
