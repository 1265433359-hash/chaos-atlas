apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-abort-experiment
  namespace: estatewise
spec:
  mode: one
  selector:
    namespaces:
    - estatewise
    labelSelectors:
      app: backend
  target: Request
  port: 5001
  method: GET
  path: /api/properties
  abort: true
  duration: 30s
  scheduler:
    cron: '@weekly'
