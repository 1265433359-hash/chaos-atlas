apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: service-error-500
  namespace: chaos-testing
  labels:
    experiment: http-chaos
    severity: high
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: auth-service
  mode: one
  action: abort
  target: Service
  port: 8080
  path: /api/v1/auth/token
  methods:
  - POST
  percent: '10'
  duration: 5m
