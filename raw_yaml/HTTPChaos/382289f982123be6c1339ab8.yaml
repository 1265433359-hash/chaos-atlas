apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: portal-backend-http-abort
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
    - elevatediq
    labelSelectors:
      app: portal-backend
  target: Request
  port: 8080
  method: POST
  path: /api/*
  abort: true
  duration: 1m
  scheduler:
    cron: 0 */8 * * *
