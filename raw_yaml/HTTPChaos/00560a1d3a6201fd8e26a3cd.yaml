apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: api-gateway-chaos
  namespace: load-testing
spec:
  mode: all
  selector:
    namespaces:
    - kong
    labelSelectors:
      app: kong-proxy
  target: Request
  port: 8000
  method: POST
  path: /api/v1/neural/*
  abort: true
  duration: 30s
  scheduler:
    cron: '@every 1h'
