apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: sentiment-http-patch-response
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app.kubernetes.io/name: mlops-sentiment
  target: Response
  port: 8000
  path: /api/v1/predict
  patch:
    body:
      type: JSON
      value: '{"error": "Chaos injected error", "status": "chaos"}'
    headers:
    - - X-Chaos-Injected
      - 'true'
  duration: 2m
  scheduler:
    cron: '@every 6h'
