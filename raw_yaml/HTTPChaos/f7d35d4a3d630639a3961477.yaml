apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: sentiment-http-delay
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app.kubernetes.io/name: mlops-sentiment
  target: Request
  port: 8000
  path: /api/v1/predict
  delay: 2s
  duration: 5m
  scheduler:
    cron: '@every 2h'
