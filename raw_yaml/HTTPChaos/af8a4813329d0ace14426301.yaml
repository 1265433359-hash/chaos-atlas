apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: tcc-http-chaos
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
    - app-tcc
    labelSelectors:
      app: tcc-api
  target: Response
  port: 3000
  path: '*'
  abort: false
  replace:
    code: 500
  duration: 180s
