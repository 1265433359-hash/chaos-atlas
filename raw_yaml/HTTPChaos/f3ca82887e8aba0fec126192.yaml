apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-delay
  namespace: chaos-testing
spec:
  mode: all
  duration: 10m
  selector:
    namespaces:
    - skalean-system
    labelSelectors:
      app: api-gateway
  target: Request
  port: 4000
  method: GET
  path: /api/*
  delay: 3s
  scheduler:
    cron: '@every 2h'
