apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: data-plane-http-delay
  namespace: govsecure
spec:
  mode: one
  selector:
    namespaces:
    - govsecure
    labelSelectors:
      app: data-plane
  target: Request
  port: 8080
  path: /api/*
  delay: 500ms
  duration: 1m
  scheduler:
    cron: '@every 6h'
