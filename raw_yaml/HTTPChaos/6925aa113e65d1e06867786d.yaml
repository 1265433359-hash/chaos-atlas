apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: schema-registry-abort
  namespace: schema-registry
spec:
  mode: all
  selector:
    namespaces:
    - schema-registry
    labelSelectors:
      app: schema-registry
  target: Response
  port: 8081
  path: '*'
  abort: true
  duration: 1m
