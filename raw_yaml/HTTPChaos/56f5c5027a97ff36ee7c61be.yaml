apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: backend-http-patch
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
    - production
    labelSelectors:
      app: smart-ai-tutor
      component: backend
  port: 8000
  path: /api/v1/*
  patch:
    headers:
    - - X-Chaos-Injected
      - 'true'
    body:
      type: JSON
      value: '{"error": "Chaos Engineering Test", "code": "CHAOS_FAULT"}'
  duration: 1m
