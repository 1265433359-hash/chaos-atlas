apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: backend-http-error
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: backend
  target: Request
  port: 8081
  path: /api/backend
  abort: true
  duration: 30s
  scheduler:
    cron: '@every 15m'
