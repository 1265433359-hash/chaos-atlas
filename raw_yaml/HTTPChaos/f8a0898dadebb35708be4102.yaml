apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: database-connection-delay
  namespace: chaos-testing
  labels:
    experiment: database-chaos
    severity: high
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: postgres-primary
  mode: one
  action: delay
  delay: 1000ms
  percent: '25'
  target: Service
  port: 5432
  duration: 10m
