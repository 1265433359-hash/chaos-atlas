apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: sentiment-http-abort
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app.kubernetes.io/name: mlops-sentiment
  target: Request
  port: 8000
  path: /api/v1/predict
  abort: true
  duration: 1m
  scheduler:
    cron: '@every 4h'
