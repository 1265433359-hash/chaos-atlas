apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-abort-test
  namespace: production
  annotations:
    description: Inject HTTP 500 errors from database service
spec:
  mode: all
  selector:
    namespaces:
    - production
    labelSelectors:
      app: postgresql-proxy
  target: Request
  port: 5432
  path: '*'
  abort: true
  statusCode: 500
  duration: 3m
