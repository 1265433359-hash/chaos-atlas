apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: cross-tenant-api-denial
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
    - tenant-alice
    - tenant-bob
  target: Request
  port: 8080
  path: /api/tenant/*
  method: GET
  duration: 30m
  abort: true
  scheduler:
    cron: '*/30 * * * *'
