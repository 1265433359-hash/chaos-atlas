apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-abort-chaos
  namespace: elevatediq-production
  labels:
    app.kubernetes.io/name: chaos-experiment
    app.kubernetes.io/component: http-abort
    app.kubernetes.io/part-of: elevatediq
spec:
  mode: all
  selector:
    namespaces:
    - elevatediq-production
    labelSelectors:
      app.kubernetes.io/name: elite-scanner
  target: Request
  port: 8080
  path: /api/v1/*
  method: GET
  abort: true
  percent: 10
  duration: 60s
