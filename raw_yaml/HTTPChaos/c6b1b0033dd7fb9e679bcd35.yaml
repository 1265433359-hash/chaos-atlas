apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-abort
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
    - production
    labelSelectors:
      app: ergo-web
  target: Request
  port: 3000
  method: GET
  path: /api/*
  abort: true
  duration: 1m
  scheduler:
    cron: 0 2 * * 6
