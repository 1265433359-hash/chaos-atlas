apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-rate-limit-chaos
  namespace: elevatediq-production
  labels:
    app.kubernetes.io/name: chaos-experiment
    app.kubernetes.io/component: http-ratelimit
spec:
  mode: all
  selector:
    namespaces:
    - elevatediq-production
    labelSelectors:
      app.kubernetes.io/name: elite-scanner
  target: Response
  port: 8080
  path: /api/*
  replace:
    code: 429
    body: '{"error": "Rate limit exceeded", "retry_after": 30}'
    headers:
      Content-Type: application/json
      Retry-After: '30'
      X-RateLimit-Remaining: '0'
  percent: 15
  duration: 60s
