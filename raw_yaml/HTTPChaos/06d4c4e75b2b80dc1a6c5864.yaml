apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-failure-test
  namespace: chaos-system
  labels:
    app: chaos-experiment
    scenario: advanced
spec:
  mode: one
  duration: 10m
  scheduler:
    cron: 0 21 * * 4
  selector:
    namespaces:
    - pake-system
    labelSelectors:
      app: pake-api
    expressionSelectors:
    - key: chaos-test
      operator: In
      values:
      - enabled
  target: Request
  port: 8080
  path: /api/v1/*
  method: GET
  abort: true
  delay: 5s
  replace:
    code: 500
    headers:
      Content-Type:
      - application/json
    body: '{"error": "Chaos engineering test failure"}'
