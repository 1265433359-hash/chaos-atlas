apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-request-body-modify
  namespace: chaos-demo
spec:
  mode: all
  selector:
    namespaces:
    - chaos-demo
    labelSelectors:
      app: backend
  target: Request
  port: 5001
  path: /process
  method: POST
  replace:
    body: '{"chaos_injected":true,"original_data":"replaced","timestamp":1234567890}'
  duration: 3m
