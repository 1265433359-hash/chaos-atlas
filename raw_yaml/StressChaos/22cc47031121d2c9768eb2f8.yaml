apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: data-plane-cpu-stress
  namespace: govsecure
spec:
  mode: one
  selector:
    namespaces:
    - govsecure
    labelSelectors:
      app: data-plane
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 30s
  scheduler:
    cron: '@every 6h'
