apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: template-memory-pressure
  namespace: chaos-experiments
  labels:
    template: memory-pressure
    severity: high
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: data-processor
  mode: one
  action: memory
  stressors:
    memory:
      workers: 2
      size: 2GB
  duration: 5m
