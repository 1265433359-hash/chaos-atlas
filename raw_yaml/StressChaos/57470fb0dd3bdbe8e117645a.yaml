apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-test
  namespace: trading-bot
spec:
  mode: one
  selector:
    namespaces:
    - trading-bot
    labelSelectors:
      app: trading-bot-api
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 3m
  scheduler:
    cron: '@every 24h'
