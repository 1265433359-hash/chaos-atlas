apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: decision-engine-cpu-stress
  namespace: stage10
spec:
  mode: fixed-percent
  value: '30'
  selector:
    namespaces:
    - stage10
    labelSelectors:
      app: decision-engine
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 10m
  scheduler:
    cron: '@every 3h'
