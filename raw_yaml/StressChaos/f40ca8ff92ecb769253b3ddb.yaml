apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress-experiment
  namespace: estatewise
spec:
  mode: one
  selector:
    namespaces:
    - estatewise
    labelSelectors:
      app: backend
  stressors:
    memory:
      workers: 1
      size: 512MB
  duration: 1m
  scheduler:
    cron: '@daily'
