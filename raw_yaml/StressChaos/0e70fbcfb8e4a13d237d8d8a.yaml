apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: resource-isolation-stress
  namespace: chaos-testing
spec:
  mode: fixed
  value: '2'
  selector:
    namespaces:
    - tenant-alice
  duration: 15m
  stressors:
    cpu:
      workers: 4
      load: 80
    memory:
      workers: 2
      size: 1GB
  scheduler:
    cron: 0 */2 * * *
