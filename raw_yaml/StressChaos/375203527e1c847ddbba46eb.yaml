apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: sentiment-cpu-stress
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app.kubernetes.io/name: mlops-sentiment
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 5m
  scheduler:
    cron: '@every 1h'
