apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-hog
  namespace: chaos-testing
  labels:
    app.kubernetes.io/part-of: chaos-engineering-toolkit
    experiment: memory-hog
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: target-service
  stressors:
    memory:
      workers: 1
      size: 256MB
  duration: 5m
