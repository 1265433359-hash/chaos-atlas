apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-pressure-production
  namespace: chaos-testing
  labels:
    experiment: stress-cpu
    severity: high
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: analytics-engine
  mode: one
  stressors:
    cpu:
      workers: 4
      load: 80
      options:
      - --cpu 4
      - --load 80
  duration: 15m
