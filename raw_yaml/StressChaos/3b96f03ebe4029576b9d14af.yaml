apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-pressure-service
  namespace: chaos-testing
  labels:
    experiment: stress-memory
    severity: high
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: payment-processor
  mode: one
  stressors:
    memory:
      workers: 1
      size: 1GB
      options:
      - --vm
      - --vm-bytes 1G
      - --vm-keep
  duration: 5m
