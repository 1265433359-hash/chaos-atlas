apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-pressure-experiment
  namespace: selfhealing
spec:
  mode: one
  selector:
    namespaces:
    - selfhealing
    labelSelectors:
      app: crave-backend
  stressors:
    memory:
      workers: 4
      size: 512MB
  duration: 2m
