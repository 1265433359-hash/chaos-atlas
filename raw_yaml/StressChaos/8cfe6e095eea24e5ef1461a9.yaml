apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: pesitwizard-memory-stress
  namespace: staging
  labels:
    app: pesitwizard
    chaos-type: memory-stress
spec:
  mode: one
  selector:
    namespaces:
    - staging
    labelSelectors:
      app: pesitwizard-server
  stressors:
    memory:
      workers: 2
      size: 512Mi
  duration: 5m
