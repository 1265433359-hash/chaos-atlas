apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: remitflow-server-cpu-stress
  namespace: remitflow-staging
  labels:
    app.kubernetes.io/part-of: remitflow
    chaos-type: resource
    target: server
spec:
  mode: one
  selector:
    namespaces:
    - remitflow-staging
    labelSelectors:
      app: remitflow-server
  stressors:
    cpu:
      workers: 4
      load: 80
  duration: 5m
  scheduler:
    cron: '@every 12h'
