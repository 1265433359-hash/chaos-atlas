apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress
  namespace: chaos-testing
spec:
  mode: random-max-percent
  value: '30'
  duration: 10m
  selector:
    namespaces:
    - skalean-system
  stressors:
    memory:
      workers: 1
      size: 512Mi
  scheduler:
    cron: '@every 3h'
