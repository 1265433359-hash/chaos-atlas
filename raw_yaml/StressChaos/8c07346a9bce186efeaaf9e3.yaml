apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-pressure-all
  namespace: chaos-testing
  labels:
    experiment: stress-memory
    severity: critical
spec:
  selector:
    namespaces:
    - production
    - staging
  mode: all
  stressors:
    memory:
      workers: 2
      size: 256MB
  duration: 3m
