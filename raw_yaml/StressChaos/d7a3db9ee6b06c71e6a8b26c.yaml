apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: gateway-resource-pressure
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
    - inference-gateway
    labelSelectors:
      app: gateway-service
  duration: 25m
  stressors:
    cpu:
      workers: 2
      load: 75
    memory:
      workers: 1
      size: 512MB
  scheduler:
    cron: 0 */5 * * *
