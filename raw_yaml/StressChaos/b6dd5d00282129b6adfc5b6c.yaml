apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: mesh-cpu-stress
  namespace: x0tta6bl4
  labels:
    scenario: cpu-stress
spec:
  mode: fixed-percent
  value: '30'
  selector:
    namespaces:
    - x0tta6bl4
    labelSelectors:
      app.kubernetes.io/name: x0tta6bl4
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 180s
  scheduler:
    cron: 0 3 * * *
