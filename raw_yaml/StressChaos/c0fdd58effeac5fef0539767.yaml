apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: aiflow-memory-stress
  namespace: agents-staging
spec:
  mode: one
  selector:
    namespaces:
    - agents-staging
    labelSelectors:
      app: aiflow-social-agent
  stressors:
    memory:
      workers: 1
      size: 512MB
  duration: 2m
