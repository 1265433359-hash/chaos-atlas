apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-test
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
    - self-healing-prod
    labelSelectors:
      app: auth-service
  stressors:
    cpu:
      workers: 4
      load: 80
  duration: 3m
  scheduler:
    cron: '@every 40m'
