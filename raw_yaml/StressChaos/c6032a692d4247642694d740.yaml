apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-test
  namespace: chaos-system
  labels:
    app: chaos-experiment
    scenario: basic-resilience
spec:
  mode: one
  duration: 15m
  scheduler:
    cron: 0 14 * * 1
  selector:
    namespaces:
    - pake-system
    labelSelectors:
      app: pake-api
    expressionSelectors:
    - key: chaos-test
      operator: In
      values:
      - enabled
  stressors:
    cpu:
      workers: 2
      load: 80
