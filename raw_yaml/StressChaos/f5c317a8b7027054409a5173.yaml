apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-pressure-upf
  namespace: open5gs
spec:
  mode: all
  selector:
    namespaces:
    - open5gs
    labelSelectors:
      app.kubernetes.io/name: upf
      app.kubernetes.io/instance: open5gs
  stressors:
    memory:
      workers: 4
      size: 2048MiB
  duration: 5m
