apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: stress-promotion
  namespace: stage
spec:
  mode: one
  selector:
    namespaces:
    - stage
    labelSelectors:
      app.kubernetes.io/name: promotion-service
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 5m
