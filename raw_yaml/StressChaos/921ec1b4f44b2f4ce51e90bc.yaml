apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress-example
  namespace: chaos-mesh
spec:
  mode: one
  selector:
    namespaces:
    - moodify-staging
    labelSelectors:
      app: moodify
      component: backend
  stressors:
    memory:
      workers: 1
      size: 512Mi
  duration: 3m
