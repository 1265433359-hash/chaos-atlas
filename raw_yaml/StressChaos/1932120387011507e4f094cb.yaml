apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: noisy-spikes-cpu
  namespace: boutique
spec:
  mode: random-max-percent
  value: '40'
  selector:
    namespaces:
    - boutique
    labelSelectors:
      app: frontend
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 30s
