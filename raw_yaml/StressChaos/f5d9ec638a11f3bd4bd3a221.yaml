apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-pressure-multi-service
  namespace: chaos-testing
  labels:
    experiment: stress-cpu
    severity: medium
spec:
  selector:
    namespaces:
    - production
  mode: all
  stressors:
    cpu:
      workers: 2
      load: 50
  duration: 10m
