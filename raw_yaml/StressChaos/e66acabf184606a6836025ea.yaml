apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: operator-cpu-stress
  namespace: chaos-testing
  labels:
    app.kubernetes.io/part-of: stellar-chaos-suite
    chaos/experiment: 06-cpu-stress
    chaos/category: resource-exhaustion
spec:
  mode: one
  selector:
    namespaces:
    - stellar-system
    labelSelectors:
      app: stellar-operator
  stressors:
    cpu:
      workers: 4
      load: 90
  duration: 60s
  scheduler:
    cron: '@once'
