apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-experiment
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: farmer-platform
      tier: backend
  stressors:
    cpu:
      workers: 2
      load: 50
  duration: 3m
  scheduler:
    cron: '@every 4h'
