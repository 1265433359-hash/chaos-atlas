kind: StressChaos
metadata:
  name: escrow-service-skill-f11-cpu-stress
  namespace: vibe-coding
spec:
  mode: all
  selector:
    namespaces:
    - vibe-coding
    labelSelectors:
      app: escrow-service-skill
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 120s
