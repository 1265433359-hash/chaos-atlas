apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: auth-service-memory-stress
  namespace: chaos-engineering
  labels:
    experiment-type: memory-stress
    target-service: auth-service
    severity: medium
    automation: enabled
spec:
  mode: one
  selector:
    namespaces:
    - rust-security-dev
    labelSelectors:
      app: auth-service
  stressors:
    memory:
      size: 256MB
      workers: 1
  duration: 3m
  scheduler:
    cron: 0 2 * * 1,3,5
