apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
    - llm-marketplace
    labelSelectors:
      app: ml-recommendations
  stressors:
    memory:
      workers: 4
      size: 1GB
      options:
      - --vm-keep
  duration: 3m
