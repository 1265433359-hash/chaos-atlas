apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: worker-cpu-stress
  namespace: sentinelrag-chaos
spec:
  mode: all
  selector:
    namespaces:
    - sentinelrag
    labelSelectors:
      app.kubernetes.io/component: temporal-worker
      app.kubernetes.io/part-of: sentinelrag
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 10m
