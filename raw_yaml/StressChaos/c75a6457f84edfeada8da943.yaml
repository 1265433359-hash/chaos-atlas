apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-leak-simulation
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: recommendation-engine
  stressors:
    memory:
      workers: 1
      size: 512Mi
  duration: 5m
