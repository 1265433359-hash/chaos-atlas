apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress
  namespace: chaos-testing
spec:
  mode: random-max-percent
  value: '50'
  duration: 10m
  selector:
    namespaces:
    - skalean-system
  stressors:
    cpu:
      workers: 2
      load: 80
  scheduler:
    cron: '@every 3h'
