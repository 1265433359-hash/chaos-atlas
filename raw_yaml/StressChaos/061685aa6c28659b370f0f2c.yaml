apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: io-stress-experiment
  namespace: chaos-testing
  labels:
    experiment: io-stress
    severity: low
spec:
  mode: one
  selector:
    namespaces:
    - ecommerce-prod
    labelSelectors:
      app: core-service
  stressors:
    memory:
      workers: 1
      size: 256MB
      options:
      - --vm-keep
  duration: 3m
