apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress-experiment
  namespace: chaos-testing
  labels:
    experiment: memory-stress
    severity: medium
spec:
  mode: one
  selector:
    namespaces:
    - ecommerce-prod
    labelSelectors:
      app: core-service
  stressors:
    memory:
      workers: 1
      size: 512MB
  duration: 5m
