apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: combined-stress
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
    - llm-marketplace
    labelSelectors:
      app: tenant-management
  stressors:
    cpu:
      workers: 2
      load: 50
    memory:
      workers: 2
      size: 256MB
  duration: 5m
