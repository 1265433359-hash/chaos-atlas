apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: network-io-stress
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
    - llm-marketplace
    labelSelectors:
      app: graphql-gateway
  stressors:
    cpu:
      workers: 1
      load: 30
  duration: 5m
  containerNames:
  - graphql-gateway
