apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-test
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: event-processor-service
  stressors:
    cpu:
      workers: 4
      load: 80
  duration: 10m
  scheduler:
    cron: '@every 8h'
