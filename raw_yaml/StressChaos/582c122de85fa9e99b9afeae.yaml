apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: portal-backend-memory-stress
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
    - elevatediq
    labelSelectors:
      app: portal-backend
  stressors:
    memory:
      workers: 1
      size: 512MB
  duration: 2m
  scheduler:
    cron: 0 4 * * 0
