apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress-experiment
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: farmer-platform
  stressors:
    memory:
      workers: 4
      size: 256MB
  duration: 2m
  scheduler:
    cron: '@every 6h'
