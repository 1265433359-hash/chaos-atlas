apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-experiment
  namespace: estatewise
spec:
  mode: one
  selector:
    namespaces:
    - estatewise
    labelSelectors:
      app: backend
  stressors:
    cpu:
      workers: 2
      load: 50
  duration: 2m
  scheduler:
    cron: '@daily'
