apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: sentiment-mixed-stress
  namespace: default
spec:
  mode: fixed
  value: '1'
  selector:
    namespaces:
    - default
    labelSelectors:
      app.kubernetes.io/name: mlops-sentiment
  stressors:
    cpu:
      workers: 1
      load: 50
    memory:
      workers: 1
      size: 256MB
  duration: 4m
  scheduler:
    cron: '@every 3h'
