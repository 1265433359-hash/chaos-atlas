apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: vernemq-resource-stress
  namespace: chaos-mesh
  labels:
    experiment-type: resource
    target-service: vernemq
    severity: high
    storage.samcloud.online/tier: standard
spec:
  mode: fixed
  value: '1'
  duration: 25m
  selector:
    namespaces:
    - storage
    labelSelectors:
      app.kubernetes.io/name: vernemq
  stressors:
    cpu:
      workers: 2
      load: 80
    memory:
      workers: 1
      size: 1GB
  scheduler:
    cron: 0 18 * * FRI
