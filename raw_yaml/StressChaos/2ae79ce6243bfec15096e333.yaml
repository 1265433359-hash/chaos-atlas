apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress-test
  namespace: chaos-system
  labels:
    app: chaos-experiment
    scenario: basic-resilience
spec:
  mode: one
  duration: 15m
  scheduler:
    cron: 0 15 * * 1
  selector:
    namespaces:
    - pake-system
    labelSelectors:
      app: pake-ai
    expressionSelectors:
    - key: chaos-test
      operator: In
      values:
      - enabled
  stressors:
    memory:
      workers: 1
      size: 2GB
