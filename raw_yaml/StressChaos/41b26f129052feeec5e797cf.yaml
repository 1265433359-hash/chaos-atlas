apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress
  namespace: chaos-testing
  labels:
    app.kubernetes.io/part-of: chaos-engineering-toolkit
    experiment: cpu-stress
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: target-service
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 5m
