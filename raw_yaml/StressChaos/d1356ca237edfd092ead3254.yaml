apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cartservice-memory-leak
  namespace: chaos-mesh
spec:
  mode: one
  selector:
    namespaces:
    - online-boutique
    labelSelectors:
      app: cartservice
  stressors:
    memory:
      workers: 1
      size: 800MB
  duration: 10m
