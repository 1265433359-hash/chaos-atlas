apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: data-plane-memory-stress
  namespace: govsecure
spec:
  mode: one
  selector:
    namespaces:
    - govsecure
    labelSelectors:
      app: data-plane
  stressors:
    memory:
      workers: 1
      size: 256MB
  duration: 1m
  scheduler:
    cron: '@every 6h'
