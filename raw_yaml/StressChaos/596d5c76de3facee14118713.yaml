apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-example
  namespace: chaos-mesh
spec:
  mode: one
  selector:
    namespaces:
    - apps
    labelSelectors:
      app: my-app
      chaos-testing: enabled
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 2m
  scheduler:
    cron: '@every 15m'
