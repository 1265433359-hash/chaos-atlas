apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: combined-cpu-memory-pressure
  namespace: chaos-testing
  labels:
    experiment: stress-combined
    severity: critical
spec:
  selector:
    namespaces:
    - production
  mode: random
  stressors:
    cpu:
      workers: 2
      load: 70
    memory:
      workers: 1
      size: 512MB
  duration: 10m
