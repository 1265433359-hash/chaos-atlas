apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: node-cpustress
  namespace: default
spec:
  mode: all
  selector:
    namespaces:
    - default
    expressionSelectors:
    - key: node-role.kubernetes.io/worker
      operator: Exists
  stressors:
    cpu:
      workers: 4
      load: 90
  duration: 5m
