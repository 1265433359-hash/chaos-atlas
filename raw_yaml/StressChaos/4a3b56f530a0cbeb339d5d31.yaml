apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: tcc-stress-chaos
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
    - app-tcc
    labelSelectors:
      app: tcc-api
  stressors:
    cpu:
      workers: 2
      load: 80
    memory:
      workers: 2
      size: 256MB
  duration: 180s
