apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: redis-memory-stress
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
    - redis
    labelSelectors:
      app: redis-cluster
  stressors:
    memory:
      workers: 1
      size: 1GB
  duration: 2m
  scheduler:
    cron: '@every 15m'
