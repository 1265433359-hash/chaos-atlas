apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-payment-service
  namespace: chaos-testing
  labels:
    experiment-type: cpu-stress
    target-service: payment-service
    risk-level: low
spec:
  mode: one
  selector:
    namespaces:
    - microservices-staging
    labelSelectors:
      app.kubernetes.io/name: payment-service
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 5m
