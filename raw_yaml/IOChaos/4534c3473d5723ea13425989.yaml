apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-delay
  namespace: chaos-mesh
spec:
  action: latency
  mode: one
  selector:
    namespaces:
    - nebula-production
    labelSelectors:
      app: postgres
  volumePath: /var/lib/postgresql/data
  path: /var/lib/postgresql/data/**/*
  delay: 100ms
  percent: 50
  duration: 5m
