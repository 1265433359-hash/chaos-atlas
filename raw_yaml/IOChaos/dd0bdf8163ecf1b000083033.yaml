apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-stress-experiment
  namespace: qbitel
spec:
  action: latency
  mode: one
  selector:
    namespaces:
    - qbitel
    labelSelectors:
      app: qbitel
  volumePath: /data
  path: /data/**/*
  delay: 100ms
  percent: 50
  duration: 5m
