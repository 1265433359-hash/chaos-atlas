apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: kafka-io-fault
  namespace: kafka-cluster
spec:
  action: fault
  mode: one
  selector:
    namespaces:
    - kafka-cluster
    labelSelectors:
      strimzi.io/cluster: kafka-cluster
      strimzi.io/kind: Kafka
  volumePath: /var/lib/kafka/data/kafka-log0
  path: '*.log'
  errno: 5
  percent: 10
  duration: 1m
