apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: provider-storage-latency
  namespace: chaos-testing
spec:
  action: latency
  mode: all
  selector:
    namespaces:
    - inference-gateway
    labelSelectors:
      app: local-llama-provider
  volumePath: /data
  path: /data/models/**
  delay: 5s
  duration: 30m
  percent: 50
  scheduler:
    cron: 0 */8 * * *
