apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: l4-agent-io-latency
  namespace: fabric4l
  labels:
    app.kubernetes.io/part-of: fabric4l-chaos
    chaos-mesh.org/experiment: l4-io-latency
  annotations:
    description: Inject {{LATENCY_MS}}ms I/O latency into L4 Agent
    owner: sre-team@fabric4l.io
spec:
  action: latency
  mode: all
  selector:
    namespaces:
    - fabric4l
    labelSelectors:
      app: l4-agent
  volumePath: /tmp
  path: ''
  delay: ${LATENCY_MS}ms
  percent: 100
  methods:
  - READ
  - WRITE
  - OPEN
  duration: 10m
