apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-stress-test
  namespace: chaos-testing
spec:
  action: latency
  mode: one
  selector:
    namespaces:
    - self-healing-prod
    labelSelectors:
      app: logging-service
  volumePath: /var/log
  path: /var/log/**/*
  delay: 100ms
  percent: 50
  duration: 4m
