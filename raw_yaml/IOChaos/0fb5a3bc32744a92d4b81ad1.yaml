apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  namespace: his-hope
  name: disk-delay
  labels:
    app.kubernetes.io/part-of: his-hope
    chaos-mesh/experiment-type: io-fault
    chaos-mesh/schedule: routine
  annotations:
    description: Injects 100ms I/O latency on PostgreSQL's data directory every 24
      hours to test database query timeout handling
    maintainer: his-hope-sre@hishop.com
    game-day-scope: monthly-full-chaos
spec:
  action: latency
  mode: one
  selector:
    namespaces:
    - his-hope
    labelSelectors:
      app.kubernetes.io/name: postgres
  volumePath: /var/lib/postgresql/data
  path: /var/lib/postgresql/data/**/*
  delay: 100ms
  duration: 2m
  scheduler:
    cron: '@every 24h'
