apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: disk-pressure-experiment
  namespace: default
spec:
  action: latency
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: farmer-platform
  volumePath: /var/lib/data
  path: '**/*'
  delay: 100ms
  percent: 50
  duration: 2m
  scheduler:
    cron: '@every 8h'
