apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-delay-test
  namespace: trading-bot
spec:
  action: latency
  mode: one
  selector:
    namespaces:
    - trading-bot
    labelSelectors:
      app: postgres
  volumePath: /var/lib/postgresql/data
  path: '**/*'
  delay: 100ms
  percent: 50
  duration: 5m
  scheduler:
    cron: 0 4 * * 0
