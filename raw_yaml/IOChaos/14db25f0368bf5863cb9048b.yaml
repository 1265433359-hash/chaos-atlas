apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-attr-override-chaos
  namespace: staging
  labels:
    app.kubernetes.io/part-of: gp-chaos-engineering
spec:
  action: attrOverride
  mode: all
  selector:
    namespaces:
    - staging
    labelSelectors:
      app.kubernetes.io/part-of: my-app
  volumePath: /data
  path: '*'
  attr:
    size: 0
  percent: 50
  duration: 30s
