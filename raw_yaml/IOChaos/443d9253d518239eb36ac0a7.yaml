apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: data-corruption
  namespace: chaos-testing
spec:
  action: mistake
  mode: one
  selector:
    namespaces:
    - llm-marketplace
  volumePath: /var/lib/data
  path: /var/lib/data/**/*.db
  mistake:
    filling: random
    maxOccurrences: 10
    maxLength: 100
  percent: 5
  duration: 1m
