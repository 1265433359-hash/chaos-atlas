apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-delay
  namespace: chaos-testing
spec:
  action: latency
  mode: all
  selector:
    namespaces:
    - production
    labelSelectors:
      app: postgres
  volumePath: /var/lib/postgresql/data
  path: '*'
  delay: 100ms
  percent: 50
  duration: 1m
