apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: slow-report-storage
  namespace: solar3d-staging
spec:
  action: latency
  mode: all
  selector:
    namespaces:
    - solar3d-staging
    labelSelectors:
      app: report-service
  volumePath: /var/lib/solar3d/objstore
  path: /var/lib/solar3d/objstore/**/*
  delay: 500ms
  percent: 50
  duration: 10m
