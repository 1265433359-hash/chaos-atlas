apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: disk-stress
  namespace: chaos-testing
spec:
  action: mixed
  mode: one
  selector:
    namespaces:
    - llm-marketplace
    labelSelectors:
      app: postgres
  volumePath: /var/lib/postgresql/data
  path: /var/lib/postgresql/data/*
  delay: 100ms
  percent: 50
  duration: 3m
