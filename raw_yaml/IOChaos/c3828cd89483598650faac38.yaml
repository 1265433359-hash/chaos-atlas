apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-attr-override
  namespace: chaos-demo
spec:
  action: attrOverride
  mode: all
  selector:
    namespaces:
    - chaos-demo
    labelSelectors:
      app: backend
  volumePath: /app
  attr:
    perm: 0
  percent: 100
  duration: 1m
