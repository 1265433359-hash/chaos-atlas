apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-latency-cache-service
  namespace: chaos-testing
  labels:
    experiment: io-latency
    severity: medium
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: redis-cache
  mode: one
  action: latency
  delay: 50ms
  percent: '30'
  path: /data
  volumePath: /data
  duration: 5m
