apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: disk-fill-experiment
  namespace: default
spec:
  action: attrOverride
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app: farmer-platform
  volumePath: /tmp
  path: chaos-fill
  attr:
    size: 1073741824
  duration: 1m
  scheduler:
    cron: '@every 12h'
