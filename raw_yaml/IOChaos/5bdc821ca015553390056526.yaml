apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: disk-fill-test
  namespace: production
  annotations:
    description: Fill disk space to test disk full handling
spec:
  action: faults
  mode: one
  selector:
    namespaces:
    - production
    labelSelectors:
      app: log-collector
  volumePath: /var/log
  path: /var/log/large-file
  percent: 80
  duration: 5m
