apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-throught-5
  namespace: io-throught-5
spec:
  action: fault
  mode: all
  selector:
    namespaces:
    - io-throught-5
    labelSelectors:
      app: myapp
  volumePath: /app/data
  path: /app/data/**/*
  methods:
  - write
  errno: 5
  percent: 50
  duration: 5m
