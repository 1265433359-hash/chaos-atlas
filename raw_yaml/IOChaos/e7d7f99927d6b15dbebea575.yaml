apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-fault-experiment
  namespace: chaos-mesh
spec:
  action: fault
  mode: random-max-percent
  value: '30'
  selector:
    namespaces:
    - microservices
    labelSelectors:
      app: order-service
  volumePath: /data
  path: /data/orders/*
  errno: 5
  percent: 100
  duration: 2m
