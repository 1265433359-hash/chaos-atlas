apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: disk-latency-postgres
  namespace: chaos-testing
  labels:
    experiment-type: io-latency
    target-service: postgres
    risk-level: medium
spec:
  action: latency
  mode: one
  selector:
    namespaces:
    - database
    labelSelectors:
      app.kubernetes.io/name: postgresql
  volumePath: /var/lib/postgresql/data
  path: '**'
  delay: 100ms
  percent: 50
  duration: 3m
