apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: disk-write-fault
  namespace: backend
spec:
  action: fault
  mode: fixed-percent
  value: '50'
  selector:
    namespaces:
    - backend
    labelSelectors:
      chaos-target: 'true'
  volumePath: /mnt/chaos
  path: /mnt/chaos/*
  errno: 28
  percent: 100
  methods:
  - WRITE
  duration: 20m
