apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-delay-experiment
  namespace: chaos-mesh
spec:
  action: latency
  mode: all
  selector:
    namespaces:
    - microservices
    labelSelectors:
      app: product-service
  volumePath: /data
  path: /data/*
  delay: 100ms
  percent: 50
  duration: 5m
