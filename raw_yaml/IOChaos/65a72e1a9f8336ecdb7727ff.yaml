apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: mimir-disk-stress
  namespace: mimir-production
spec:
  action: latency
  mode: one
  selector:
    namespaces:
    - mimir-production
    labelSelectors:
      app: postgres
  volumePath: /var/lib/postgresql/data
  path: '**/*'
  delay: 100ms
  percent: 50
  duration: 180s
  scheduler:
    cron: 0 4 * * 3
