apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: vernemq-storage-delay
  namespace: chaos-mesh
  labels:
    experiment-type: storage
    target-service: vernemq
    severity: medium
    storage.samcloud.online/tier: standard
spec:
  action: latency
  mode: fixed
  value: '1'
  duration: 20m
  selector:
    namespaces:
    - storage
    labelSelectors:
      app.kubernetes.io/name: vernemq
  delay: 500ms
  percent: 30
  path: /vernemq/data
  scheduler:
    cron: 0 16 * * WED
