apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: redis-read-latency
  namespace: fabric4l
  labels:
    app.kubernetes.io/part-of: fabric4l-chaos
    chaos-mesh.org/experiment: redis-io-latency
  annotations:
    description: Inject {{LATENCY_MS}}ms read latency into Redis
    owner: sre-team@fabric4l.io
spec:
  action: latency
  mode: all
  selector:
    namespaces:
    - fabric4l
    labelSelectors:
      app: redis
      role: master
  volumePath: /data
  path: ''
  delay: ${LATENCY_MS}ms
  percent: 100
  methods:
  - READ
  - READV
  - PREAD
  duration: 10m
