apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-mistake-experiment
  namespace: chaos-mesh
spec:
  action: mistake
  mode: all
  selector:
    namespaces:
    - microservices
    labelSelectors:
      app: api-gateway
  volumePath: /var/log
  path: /var/log/*.log
  mistake:
    filling: zero
    maxOccurrences: 10
    maxLength: 100
  percent: 50
  duration: 3m
