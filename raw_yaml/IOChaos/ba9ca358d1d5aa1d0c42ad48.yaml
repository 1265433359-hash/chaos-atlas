apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: disk-latency-read-write
  namespace: backend
spec:
  action: latency
  mode: all
  selector:
    namespaces:
    - backend
    labelSelectors:
      chaos-target: 'true'
  volumePath: /mnt/chaos
  path: /mnt/chaos/*
  delay: 80ms
  percent: 100
  methods:
  - READ
  - WRITE
  duration: 30m
