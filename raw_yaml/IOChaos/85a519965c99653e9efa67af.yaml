apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: f8-corrupt-chunk
  namespace: hippius-s3-staging
spec:
  action: mistake
  mode: one
  duration: 30s
  selector:
    namespaces:
    - hippius-s3-staging
    labelSelectors:
      app: drain-agent
  volumePath: /var/lib/hippius/local_object_cache
  path: /var/lib/hippius/local_object_cache/**
  containerNames:
  - agent
  methods:
  - read
  percent: 100
  mistake:
    filling: random
    maxOccurrences: 1
    maxLength: 16
