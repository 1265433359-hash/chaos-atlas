apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: sentiment-io-mixed
  namespace: default
spec:
  action: mixed
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app.kubernetes.io/name: mlops-sentiment
  volumePath: /app/model_cache
  path: '**/*'
  delay: 50ms
  errno: 28
  percent: 25
  duration: 2m
  scheduler:
    cron: '@every 8h'
