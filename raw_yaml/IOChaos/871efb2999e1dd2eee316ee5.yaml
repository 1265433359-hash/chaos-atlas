apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: disk-io-latency
  namespace: query-engines
spec:
  action: latency
  mode: one
  selector:
    namespaces:
    - query-engines
    labelSelectors:
      app.kubernetes.io/name: presto
  delay: 50ms
  percent: 50
  duration: 30s
  scheduler:
    cron: '@every 35m'
