apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-random
  namespace: chaos-testing
  labels:
    experiment: pod-failure
    severity: medium
spec:
  selector:
    namespaces:
    - production
    - staging
    labelSelectors:
      tier: frontend
  mode: random
  action: pod-failure
  duration: 5m
