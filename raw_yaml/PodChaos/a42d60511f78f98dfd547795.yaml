apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: az-failure-simulation
  namespace: default
spec:
  action: pod-kill
  mode: all
  selector:
    namespaces:
    - default
    expressionSelectors:
    - key: topology.kubernetes.io/zone
      operator: In
      values:
      - us-east-1a
  duration: 5m
  scheduler:
    cron: '@weekly'
