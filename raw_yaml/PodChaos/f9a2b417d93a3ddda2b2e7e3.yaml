apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-example
  namespace: chaos-mesh
spec:
  action: pod-kill
  mode: fixed-percent
  value: '10'
  duration: 1m
  selector:
    namespaces:
    - moodify-staging
    labelSelectors:
      app: moodify
  scheduler:
    cron: '@daily'
