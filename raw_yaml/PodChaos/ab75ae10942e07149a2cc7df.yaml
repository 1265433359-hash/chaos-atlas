apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: inventory-pod-kill
  namespace: apps
  labels:
    experiment: pod-kill
    service: inventory-service
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - apps
    labelSelectors:
      app: inventory-service
  duration: 60s
  gracePeriod: 0
