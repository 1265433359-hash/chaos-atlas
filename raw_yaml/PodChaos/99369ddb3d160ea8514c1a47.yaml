apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: synthetic-pod-cross-namespace-test
  namespace: chaos-testing
spec:
  action: pod-failure
  mode: fixed
  value: '1'
  selector:
    namespaces:
    - tenant-alice
    labelSelectors:
      app: synthetic-test-pod
  duration: 5m
  scheduler:
    cron: '*/30 * * * *'
