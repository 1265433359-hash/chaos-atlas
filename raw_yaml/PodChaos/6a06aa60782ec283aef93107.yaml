apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-test
  namespace: chaos-testing
spec:
  action: pod-failure
  mode: one
  duration: 30s
  selector:
    namespaces:
    - self-healing-prod
    labelSelectors:
      app: gateway-service
  scheduler:
    cron: '@every 15m'
