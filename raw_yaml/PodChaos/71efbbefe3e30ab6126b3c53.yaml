apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: rabbitmq-consumer-failure
  namespace: chaos-testing
spec:
  action: pod-failure
  mode: fixed-percent
  value: '50'
  selector:
    namespaces:
    - rabbitmq
    labelSelectors:
      app: rabbitmq-consumer
  duration: 2m
  scheduler:
    cron: '@every 15m'
