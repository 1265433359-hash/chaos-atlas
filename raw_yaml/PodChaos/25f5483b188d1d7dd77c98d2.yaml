apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: policy-service-pod-failure
  namespace: chaos-engineering
  labels:
    experiment-type: pod-failure
    target-service: policy-service
    severity: high
    automation: enabled
spec:
  action: pod-failure
  mode: fixed-percent
  value: 33%
  selector:
    namespaces:
    - rust-security-dev
    labelSelectors:
      app: policy-service
  duration: 2m
  scheduler:
    cron: 15 1 * * 1-5
