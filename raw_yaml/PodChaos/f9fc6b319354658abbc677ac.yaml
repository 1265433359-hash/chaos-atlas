apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-multiple
  namespace: chaos-testing
  labels:
    experiment: pod-kill
    severity: high
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: redis-cache
  mode: all
  action: pod-kill
  gracePeriod: 5
  duration: 2m
