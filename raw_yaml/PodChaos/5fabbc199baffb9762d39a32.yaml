apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kafka-broker-failure
  namespace: kafka
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - kafka
    labelSelectors:
      strimzi.io/name: gamemetrics-kafka-kafka
  scheduler:
    cron: '@every 24h'
  duration: 1m
