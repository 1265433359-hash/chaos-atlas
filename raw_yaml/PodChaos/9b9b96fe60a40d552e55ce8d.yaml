apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-random
  namespace: chaos-mesh
  annotations:
    description: Tue un pod aléatoire dans le namespace cible pour tester le self-healing
      Kubernetes
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - default
  duration: 30s
