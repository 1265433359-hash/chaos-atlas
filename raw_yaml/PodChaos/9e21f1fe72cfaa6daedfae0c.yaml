apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-saga-orchestrator
  namespace: chaos-testing
  labels:
    experiment-type: pod-failure
    target-service: saga-orchestrator
    risk-level: medium
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces:
    - microservices-staging
    labelSelectors:
      app.kubernetes.io/name: saga-orchestrator
  duration: 3m
