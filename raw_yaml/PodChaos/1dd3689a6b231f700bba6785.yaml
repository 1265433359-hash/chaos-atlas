apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure
  namespace: chaos-testing
spec:
  action: pod-kill
  mode: random-max-percent
  value: '30'
  duration: 60s
  selector:
    namespaces:
    - production
    labelSelectors:
      app: ergo-web
  scheduler:
    cron: '@daily'
