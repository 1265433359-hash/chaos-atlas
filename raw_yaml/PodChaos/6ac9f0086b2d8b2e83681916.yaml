apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: redis-container-kill
  namespace: chaos-engineering
  labels:
    experiment-type: container-kill
    target-service: redis
    severity: critical
    automation: enabled
spec:
  action: container-kill
  mode: one
  containerNames:
  - redis
  selector:
    namespaces:
    - rust-security-dev
    labelSelectors:
      app: redis
  scheduler:
    cron: 30 1 * * 2,4
