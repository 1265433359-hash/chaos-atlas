apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-network-chaos
  namespace: chaos-testing
  labels:
    experiment: network-chaos
    severity: high
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: postgres-primary
  mode: one
  action: pod-network-chaos
  networkChaos:
    mode: all
    selector:
      namespaces:
      - production
    direction: both
    target:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: payment-processor
    delay:
      latency: 100ms
      jitter: 20ms
      correlation: '50'
    loss:
      loss: '20'
      correlation: '50'
    duplicate: '5'
