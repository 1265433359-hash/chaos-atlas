apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: node-failure-sim
  namespace: chaos-testing
  labels:
    app.kubernetes.io/part-of: chaos-engineering-toolkit
    experiment: node-failure
  annotations:
    chaos-engineering-toolkit/description: Simulates node failure by evicting all
      pods on a node via pod-failure. Use only in non-production environments with
      explicit approval.
spec:
  action: pod-failure
  mode: all
  selector:
    namespaces:
    - default
    labelSelectors:
      app: target-service
  duration: 2m
