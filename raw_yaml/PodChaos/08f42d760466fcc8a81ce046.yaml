apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: k6-load-pod-failures
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: chaos-test
spec:
  action: pod-failure
  mode: fixed
  value: '1'
  selector:
    namespaces:
    - securerag-hub
    labelSelectors:
      app: conversation-service
  duration: 4m
