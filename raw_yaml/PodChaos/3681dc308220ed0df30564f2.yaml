apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-api
  namespace: cluster-probe
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - cluster-probe
    labelSelectors:
      app.kubernetes.io/component: api
  scheduler:
    cron: '@every 60s'
  duration: 5m
