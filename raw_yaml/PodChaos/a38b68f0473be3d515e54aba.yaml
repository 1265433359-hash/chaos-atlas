apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: relibank-bill-pay-resilience-test
  namespace: relibank
  labels:
    app: relibank
    experiment-type: pod-chaos
    target-flow: bill-payment
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - relibank
    labelSelectors:
      app: bill-pay-service
  duration: 2m
  gracePeriod: 0
