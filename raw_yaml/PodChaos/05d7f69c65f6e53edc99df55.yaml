apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: clickhouse-pod-failure
  namespace: query-engines
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces:
    - query-engines
    labelSelectors:
      app.kubernetes.io/name: clickhouse
  duration: 30s
  scheduler:
    cron: '@every 5m'
