apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: node-failure-simulation
  namespace: query-engines
spec:
  action: pod-failure
  mode: all
  selector:
    namespaces:
    - query-engines
    labelSelectors:
      NodeGroup: analytics
  duration: 60s
  scheduler:
    cron: '@every 30m'
