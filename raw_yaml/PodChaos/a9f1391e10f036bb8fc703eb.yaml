apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: neural-pod-failure
  namespace: load-testing
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces:
    - terrafusion-cosmic
    labelSelectors:
      cosmic-role: neural-network
  duration: 1m
  scheduler:
    cron: '@every 30m'
