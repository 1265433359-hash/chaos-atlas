apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-25pct
  namespace: mesh-system
spec:
  action: pod-kill
  mode: fixed-percent
  value: '25'
  selector:
    namespaces:
    - mesh-system
    labelSelectors:
      app.kubernetes.io/component: mesh-node
  duration: 60s
  scheduler:
    cron: '@every 5m'
