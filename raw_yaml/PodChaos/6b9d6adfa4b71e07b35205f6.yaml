apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  namespace: his-hope
  name: kill-coredns-recovery-test
  labels:
    app.kubernetes.io/part-of: his-hope
    chaos-mesh/experiment-type: pod-kill
    chaos-mesh/schedule: test
  annotations:
    description: Kills a CoreDNS pod every 24 hours to test DNS resolution recovery
      after DNS fault injection. Validates that gRPC name resolution and service discovery
      survive CoreDNS pod restarts.
    maintainer: his-hope-sre@hishop.com
    game-day-scope: monthly-full-chaos
    recovery-plan: CoreDNS runs as a Deployment; verify DNS resolution resumes within
      5s of pod restart and no gRPC connections permanently fail
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - kube-system
    labelSelectors:
      k8s-app: kube-dns
  duration: 30s
  scheduler:
    cron: '@every 24h'
