apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: relibank-messaging-service
  namespace: relibank
  labels:
    app: relibank
    experiment-type: pod-chaos
    target-flow: messaging-notifications
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - relibank
    labelSelectors:
      app: notifications-service
  duration: 60s
  gracePeriod: 0
