apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-test
  namespace: production
  annotations:
    description: Kill 20% of API server pods to test self-healing
spec:
  action: pod-failure
  mode: fixed-percent
  value: '20'
  duration: 5m
  selector:
    namespaces:
    - production
    labelSelectors:
      app: api-server
  scheduler:
    cron: '@every 1h'
