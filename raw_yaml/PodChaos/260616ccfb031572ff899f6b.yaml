apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: inference-provider-outage
  namespace: chaos-testing
spec:
  action: pod-kill
  mode: fixed-percent
  value: '50'
  selector:
    namespaces:
    - inference-gateway
    labelSelectors:
      app: openai-provider
  duration: 10m
  scheduler:
    cron: 0 */4 * * *
