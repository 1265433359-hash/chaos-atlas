apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: portal-backend-pod-failure
  namespace: chaos-testing
spec:
  action: pod-failure
  mode: one
  duration: 30s
  selector:
    namespaces:
    - elevatediq
    labelSelectors:
      app: portal-backend
  scheduler:
    cron: '@every 6h'
