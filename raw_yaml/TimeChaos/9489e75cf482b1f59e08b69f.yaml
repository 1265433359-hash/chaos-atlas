apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: consensus-time-test
  namespace: chaos-testing
  labels:
    chaos.virtengine.com/category: time
    chaos.virtengine.com/scenario: consensus
spec:
  mode: one
  selector:
    namespaces:
    - virtengine
    labelSelectors:
      app.kubernetes.io/component: validator
  timeOffset: 10s
  clockIds:
  - CLOCK_REALTIME
  duration: 60s
