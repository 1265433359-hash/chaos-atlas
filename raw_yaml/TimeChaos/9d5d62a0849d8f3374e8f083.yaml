apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: time-shift-production
  namespace: chaos-testing
  labels:
    experiment: time-shift
    severity: medium
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: batch-processor
  mode: one
  timeOffset: -1h
  clockIds:
  - CLOCK_REALTIME
  duration: 5m
