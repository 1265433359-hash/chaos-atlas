apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: time-skew-test
  namespace: chaos-system
  labels:
    app: chaos-experiment
    scenario: advanced
spec:
  mode: one
  duration: 5m
  scheduler:
    cron: 0 20 * * 4
  selector:
    namespaces:
    - pake-system
    labelSelectors:
      app: pake-workers-medium
    expressionSelectors:
    - key: chaos-test
      operator: In
      values:
      - enabled
  timeOffset: -1h
