apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: time-skew-test
  namespace: chaos-engineering
  labels:
    experiment-type: time-chaos
    target-service: auth-service
    severity: low
    automation: enabled
spec:
  mode: one
  selector:
    namespaces:
    - rust-security-dev
    labelSelectors:
      app: auth-service
  timeOffset: -10m
  clockIds:
  - CLOCK_REALTIME
  duration: 2m
  scheduler:
    cron: 0 3 * * 7
