apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: sentiment-clock-skew
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
    - default
    labelSelectors:
      app.kubernetes.io/name: mlops-sentiment
  timeOffset: -1h
  duration: 5m
  scheduler:
    cron: '@every 12h'
