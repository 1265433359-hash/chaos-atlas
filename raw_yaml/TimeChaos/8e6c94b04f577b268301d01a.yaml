apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: f7-allocator-clock-skew
  namespace: hippius-s3-staging
spec:
  mode: one
  duration: 120s
  timeOffset: +120s
  clockIds:
  - CLOCK_MONOTONIC
  selector:
    namespaces:
    - hippius-s3-staging
    labelSelectors:
      app: drain-allocator
