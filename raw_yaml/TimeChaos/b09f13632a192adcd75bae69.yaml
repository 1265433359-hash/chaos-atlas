apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: time-drift-service
  namespace: chaos-testing
  labels:
    experiment: time-drift
    severity: low
spec:
  selector:
    namespaces:
    - staging
    labelSelectors:
      app: cron-scheduler
  mode: one
  timeOffset: 5m
  clockIds:
  - CLOCK_MONOTONIC
  duration: 10m
