apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: kafka-time-skew
  namespace: kafka-cluster
spec:
  mode: one
  selector:
    namespaces:
    - kafka-cluster
    labelSelectors:
      strimzi.io/cluster: kafka-cluster
      strimzi.io/kind: Kafka
  timeOffset: 5m
  duration: 2m
