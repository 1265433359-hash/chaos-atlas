apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: time-skew-payment
  namespace: chaos-testing
  labels:
    experiment-type: time-skew
    target-service: payment-service
    risk-level: medium
spec:
  mode: one
  selector:
    namespaces:
    - microservices-staging
    labelSelectors:
      app.kubernetes.io/name: payment-service
  timeOffset: +30s
  clockIds:
  - CLOCK_REALTIME
  - CLOCK_MONOTONIC
  duration: 5m
