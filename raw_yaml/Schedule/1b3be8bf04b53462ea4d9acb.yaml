kind: Schedule
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: default
  name: dns-fault1525
  annotations:
    experiment.chaos-mesh.org/pause: 'true'
spec:
  schedule: '*/5 * * * *'
  startingDeadlineSeconds: 2
  concurrencyPolicy: Forbid
  historyLimit: 1
  type: DNSChaos
  dnsChaos:
    action: error
    selector:
      namespaces:
      - default
    mode: all
    duration: 2m
    patterns:
    - google.com
    - github.com
