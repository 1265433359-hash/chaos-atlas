apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: network-disruption
  namespace: observability
spec:
  schedule: 0 * * * *
  type: NetworkChaos
  networkChaos:
    action: delay
    mode: one
    selector:
      namespaces:
      - storage
      - security
    delay:
      latency: 100ms
      correlation: '100'
      jitter: 0ms
  historyLimit: 5
  concurrencyPolicy: Forbid
