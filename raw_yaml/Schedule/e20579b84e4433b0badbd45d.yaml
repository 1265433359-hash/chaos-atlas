apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: e8-time
  namespace: chaos-mesh
spec:
  schedule: 20 7 * * *
  concurrencyPolicy: Forbid
  historyLimit: 5
  type: Workflow
  workflow:
    entry: e8
    templates:
    - name: e8
      templateType: Serial
      deadline: 10m
      children:
      - preflight-health
      - skew-and-watch
    - name: preflight-health
      templateType: StatusCheck
      deadline: 2m
      statusCheck:
        mode: Synchronous
        type: HTTP
        http:
          url: https://dev.seqtoid.org/health_check
          method: GET
          criteria:
            statusCode: '200'
    - name: skew-and-watch
      templateType: Parallel
      deadline: 5m
      children:
      - clock-skew
      - steady-state-during
    - name: clock-skew
      templateType: TimeChaos
      deadline: 3m
      timeChaos:
        mode: one
        selector:
          namespaces:
          - seqtoid-dev
          labelSelectors:
            app.kubernetes.io/component: web
        timeOffset: -10m
    - name: steady-state-during
      templateType: StatusCheck
      deadline: 4m
      statusCheck:
        mode: Continuous
        type: HTTP
        duration: 3m
        intervalSeconds: 2
        failureThreshold: 3
        recordsHistoryLimit: 100
        http:
          url: https://dev.seqtoid.org/health_check
          method: GET
          criteria:
            statusCode: '200'
