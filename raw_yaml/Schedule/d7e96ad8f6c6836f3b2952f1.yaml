apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: aiflow-chaos-schedule
  namespace: agents-staging
spec:
  schedule: 0 2 * * *
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces:
      - agents-staging
      labelSelectors:
        app: aiflow-social-agent
