apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: chaos-24h-network-duplicate
  namespace: backend
spec:
  schedule: 0 1-23/6 * * *
  type: NetworkChaos
  concurrencyPolicy: Forbid
  historyLimit: 3
  networkChaos:
    action: duplicate
    mode: fixed-percent
    value: '50'
    selector:
      namespaces:
      - backend
      labelSelectors:
        chaos-target: 'true'
    duplicate:
      duplicate: '6'
      correlation: '20'
    duration: 20m
