kind: Schedule
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  name: test
  namespace: chaos-mesh
spec:
  schedule: '@every 5s'
  startingDeadlineSeconds: null
  concurrencyPolicy: Forbid
  historyLimit: 1
  type: PhysicalMachineChaos
  physicalmachineChaos:
    action: stress-mem
    duration: 4s
    selector:
      labelSelectors:
        arch: amd64
    mode: one
    stress-mem:
      size: 100MB
