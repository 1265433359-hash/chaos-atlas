apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: pod-kill-schedule
  namespace: chaos-testing
spec:
  schedule: 0 2 * * *
  timezone: UTC
  type: PodChaos
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  podChaosTemplate:
    metadata:
      labels:
        chaos-test: pod-kill
    spec:
      action: pod-kill
      mode: fixed
      value: '1'
      duration: 5m
      startingDeadlineSeconds: 60
      selector:
        namespaces:
        - production
        labelSelectors:
          app: api-service
