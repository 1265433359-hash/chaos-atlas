apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: dns-resolution-failure
  namespace: default
spec:
  action: error
  mode: all
  selector:
    namespaces:
    - default
    labelSelectors:
      app: analytics-api
  patterns:
  - gamemetrics-kafka-bootstrap.kafka.svc.cluster.local
  duration: 3m
