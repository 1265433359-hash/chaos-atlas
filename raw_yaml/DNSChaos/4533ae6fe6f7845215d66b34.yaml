apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: template-external-failure
  namespace: chaos-experiments
  labels:
    template: external-dependency
    severity: medium
spec:
  selector:
    namespaces:
    - production
    labelSelectors:
      app: gateway
  mode: all
  action: error
  patterns:
  - '*.external-api.com'
