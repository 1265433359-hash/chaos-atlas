apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: dns-failure
  namespace: chaos-testing
  labels:
    app: ml-scheduler
    experiment: dns
spec:
  action: error
  mode: all
  selector:
    namespaces:
    - ml-scheduler
    labelSelectors:
      app: api
  patterns:
  - external-service.example.com
  duration: 30s
