apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: kafka-dns-random
  namespace: kafka-cluster
spec:
  action: random
  mode: one
  selector:
    namespaces:
    - kafka-cluster
    labelSelectors:
      strimzi.io/cluster: kafka-cluster
      strimzi.io/kind: Kafka
  patterns:
  - kafka-cluster-kafka-*
  duration: 1m
