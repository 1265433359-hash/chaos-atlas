apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: llm-upstream-dns-failure
  namespace: chrono-synth
  annotations:
    chaos.runbook: docs/operations/disaster-recovery-runbook.md#llm-dns-drill
spec:
  action: error
  mode: all
  selector:
    namespaces:
    - chrono-synth
    labelSelectors:
      app.kubernetes.io/name: backend
  patterns:
  - api.openai.com
  - api.anthropic.com
  duration: 60s
