apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: dns-error-inject
  namespace: chaos-testing
  labels:
    experiment: dns-chaos
    severity: medium
spec:
  selector:
    namespaces:
    - production
  mode: all
  action: error
  patterns:
  - external-service.example.com
  duration: 2m
