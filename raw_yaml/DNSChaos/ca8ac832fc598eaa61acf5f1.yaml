apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: dns-random-chaos
  namespace: staging
  labels:
    app.kubernetes.io/part-of: gp-chaos-engineering
spec:
  action: random
  mode: all
  selector:
    namespaces:
    - staging
    labelSelectors:
      app.kubernetes.io/part-of: my-app
  patterns:
  - external-api.example.com
  duration: 60s
