apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: dns-resolution-failure
  namespace: chaos-engineering
  labels:
    experiment-type: dns-failure
    target-service: auth-service
    severity: high
    automation: enabled
spec:
  action: error
  mode: one
  selector:
    namespaces:
    - rust-security-dev
    labelSelectors:
      app: auth-service
  patterns:
  - policy-service.*
  - redis.*
  duration: 1m
  scheduler:
    cron: 0 4 * * 3
