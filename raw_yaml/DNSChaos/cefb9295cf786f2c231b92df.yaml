apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: dns-random-domain
  namespace: chaos-testing
  labels:
    experiment: dns-chaos
    severity: low
spec:
  selector:
    namespaces:
    - development
  mode: random
  action: random
  patterns:
  - '*.internal.example.com'
  duration: 5m
