apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: cascade-failure
  namespace: chaos-testing
spec:
  entry: cascade-entry
  templates:
  - name: cascade-entry
    templateType: Serial
    deadline: 30m
    children:
    - network-degradation
    - database-failure
    - pod-cascade
  - name: network-degradation
    templateType: NetworkChaos
    deadline: 10m
    networkChaos:
      action: delay
      mode: all
      selector:
        namespaces:
        - skalean-system
      delay:
        latency: 200ms
      duration: 10m
  - name: database-failure
    templateType: PodChaos
    deadline: 5m
    podChaos:
      action: pod-kill
      mode: one
      selector:
        namespaces:
        - skalean-system
        labelSelectors:
          app: postgres
      duration: 5m
  - name: pod-cascade
    templateType: PodChaos
    deadline: 10m
    podChaos:
      action: pod-kill
      mode: fixed-percent
      value: '50'
      selector:
        namespaces:
        - skalean-system
      duration: 10m
