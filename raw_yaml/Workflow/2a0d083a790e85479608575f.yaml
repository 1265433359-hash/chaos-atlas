apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: cosmic-chaos-workflow
  namespace: load-testing
spec:
  entry: cosmic-chaos-sequence
  templates:
  - name: cosmic-chaos-sequence
    templateType: Serial
    deadline: 30m
    children:
    - inject-network-delay
    - stress-neural-pods
    - partition-quantum-network
    - recover-and-validate
  - name: inject-network-delay
    templateType: NetworkChaos
    deadline: 5m
    networkChaos:
      action: delay
      mode: all
      selector:
        namespaces:
        - terrafusion-cosmic
      delay:
        latency: 200ms
      duration: 5m
  - name: stress-neural-pods
    templateType: StressChaos
    deadline: 5m
    stressChaos:
      mode: all
      selector:
        namespaces:
        - terrafusion-cosmic
        labelSelectors:
          cosmic-role: neural-network
      stressors:
        cpu:
          workers: 8
          load: 90
      duration: 5m
  - name: partition-quantum-network
    templateType: NetworkChaos
    deadline: 5m
    networkChaos:
      action: partition
      mode: all
      selector:
        namespaces:
        - terrafusion-cosmic
        labelSelectors:
          cosmic-feature: quantum-sync
      direction: both
      duration: 5m
  - name: recover-and-validate
    templateType: Task
    deadline: 10m
    task:
      container:
        name: validator
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - 'echo "Waiting for recovery..."

          sleep 60

          echo "Validating cosmic platform health..."

          curl -f https://api.terrafusion.cosmic/health || exit 1

          echo "Platform recovered successfully!"

          '
