apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: nexus-pms-failover-test
  namespace: chaos-testing
spec:
  entry: pms-failover-sequence
  templates:
  - name: pms-failover-sequence
    templateType: Serial
    deadline: 45m
    children:
    - name: kill-postgres-primary
    - name: kill-redis-master
    - name: partition-kafka-brokers
    - name: kill-pms-api-pods
    - name: inject-db-connection-pool-exhaustion
    - name: trigger-saga-compensation
  - name: kill-postgres-primary
    templateType: PodChaos
    podChaos:
      action: pod-failure
      mode: one
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: postgres-primary
      duration: 10m
  - name: kill-redis-master
    templateType: PodChaos
    podChaos:
      action: pod-kill
      mode: one
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: redis-master
      duration: 5m
  - name: partition-kafka-brokers
    templateType: NetworkChaos
    networkChaos:
      action: partition
      mode: fixed
      value: '1'
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: kafka-broker
      direction: both
      target:
        mode: all
        selector:
          namespaces:
          - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: pms-core
      duration: 10m
  - name: kill-pms-api-pods
    templateType: PodChaos
    podChaos:
      action: pod-kill
      mode: fixed-percent
      value: '50'
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: pms-core
      duration: 5m
  - name: inject-db-connection-pool-exhaustion
    templateType: StressChaos
    stressChaos:
      mode: all
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: pms-core
      stressors:
        cpu:
          workers: 4
          load: 80
      duration: 5m
  - name: trigger-saga-compensation
    templateType: IOChaos
    ioChaos:
      action: latency
      mode: all
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: pms-core
      volumePath: /data
      path: /data/saga-state/*
      delay: 10s
      duration: 5m
