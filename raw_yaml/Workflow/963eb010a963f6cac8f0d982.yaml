apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: nexus-ai-degradation-test
  namespace: chaos-testing
spec:
  entry: ai-degradation-sequence
  templates:
  - name: ai-degradation-sequence
    templateType: Serial
    deadline: 30m
    children:
    - name: kill-gpu-nodes
    - name: inject-inference-latency
    - name: corrupt-model-cache
    - name: partition-vector-db
    - name: stress-mlflow-server
  - name: kill-gpu-nodes
    templateType: NodeChaos
    nodeChaos:
      action: node-kill
      mode: fixed-percent
      value: '25'
      selector:
        nodeSelectors:
          nvidia.com/gpu.present: 'true'
      duration: 10m
  - name: inject-inference-latency
    templateType: NetworkChaos
    networkChaos:
      action: delay
      mode: all
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: ai-inference
      delay:
        latency: 5s
        correlation: '100'
      duration: 10m
  - name: corrupt-model-cache
    templateType: IOChaos
    ioChaos:
      action: fault
      mode: all
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: ai-inference
      volumePath: /models
      path: /models/*.pt
      errno: 5
      duration: 5m
  - name: partition-vector-db
    templateType: NetworkChaos
    networkChaos:
      action: partition
      mode: all
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: vector-db
      direction: both
      target:
        mode: all
        selector:
          namespaces:
          - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: ai-inference
      duration: 5m
  - name: stress-mlflow-server
    templateType: StressChaos
    stressChaos:
      mode: all
      selector:
        namespaces:
        - nexus-prod
        labelSelectors:
          app.kubernetes.io/component: mlflow-tracking
      stressors:
        cpu:
          workers: 4
          load: 100
      duration: 5m
