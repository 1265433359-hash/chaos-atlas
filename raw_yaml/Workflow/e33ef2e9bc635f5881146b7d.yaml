apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: openstack-upgrade-chaos
  namespace: chaos-engineering
  labels:
    experiment: upgrade-simulation
    scenario: blue-green-upgrade
spec:
  entry: upgrade-simulation
  templates:
  - name: upgrade-simulation
    type: Serial
    children:
    - network-partition-test
    - service-failure-test
    - recovery-validation
  - name: network-partition-test
    type: Task
    task:
      chaos: NetworkChaos
      spec:
        action: partition
        mode: one
        selector:
          namespaces:
          - openstack-green
          labelSelectors:
            component: control-plane
        duration: 2m
  - name: service-failure-test
    type: Task
    task:
      chaos: PodChaos
      spec:
        action: pod-kill
        mode: all
        selector:
          namespaces:
          - openstack-green
          labelSelectors:
            component: keystone
        duration: 1m
  - name: recovery-validation
    type: Task
    task:
      chaos: HTTPChaos
      spec:
        mode: all
        selector:
          namespaces:
          - openstack-green
          labelSelectors:
            component: api-gateway
        target: Request
        port: 5000
        method: GET
        path: /health
        duration: 30s
