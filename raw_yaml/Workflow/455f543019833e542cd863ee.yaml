apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: storage-resilience-test
  namespace: chaos-mesh
  labels:
    experiment-type: storage
    severity: critical
spec:
  entry: storage-chaos-workflow
  templates:
  - name: storage-chaos-workflow
    templateType: Serial
    deadline: 90m
    children:
    - ceph-osd-failure
    - storage-network-partition
    - volume-performance-degradation
    - backup-system-test
    - storage-recovery-validation
  - name: ceph-osd-failure
    templateType: PodChaos
    deadline: 20m
    podChaos:
      action: pod-kill
      mode: fixed
      value: '1'
      selector:
        namespaces:
        - rook-ceph
        labelSelectors:
          app: rook-ceph-osd
  - name: storage-network-partition
    templateType: NetworkChaos
    deadline: 15m
    networkChaos:
      action: partition
      mode: fixed
      value: '1'
      direction: both
      selector:
        namespaces:
        - rook-ceph
        labelSelectors:
          app: rook-ceph-mon
  - name: volume-performance-degradation
    templateType: IOChaos
    deadline: 20m
    ioChaos:
      action: latency
      mode: all
      delay: 2s
      percent: 25
      path: /var/lib/rook
      selector:
        namespaces:
        - rook-ceph
        labelSelectors:
          app: rook-ceph-osd
  - name: backup-system-test
    templateType: Task
    deadline: 30m
    task:
      container:
        name: backup-test
        image: rook/ceph:v1.12.8
        command:
        - sh
        args:
        - -c
        - "echo \"Testing backup and restore capabilities...\"\n\n# Create test data\n\
          echo \"Creating test volume...\"\nkubectl apply -f - <<EOF\napiVersion:\
          \ v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: chaos-test-pvc\n \
          \ namespace: default\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n\
          \    requests:\n      storage: 1Gi\n  storageClassName: ceph-rbd\nEOF\n\n\
          # Wait for PVC to be bound\nkubectl wait --for=condition=Bound pvc/chaos-test-pvc\
          \ -n default --timeout=300s\n\n# Create test pod to write data\nkubectl\
          \ apply -f - <<EOF\napiVersion: v1\nkind: Pod\nmetadata:\n  name: chaos-test-writer\n\
          \  namespace: default\nspec:\n  containers:\n  - name: writer\n    image:\
          \ busybox\n    command: [\"sh\", \"-c\", \"echo 'Chaos test data' > /data/test.txt\
          \ && sleep 3600\"]\n    volumeMounts:\n    - name: test-volume\n      mountPath:\
          \ /data\n  volumes:\n  - name: test-volume\n    persistentVolumeClaim:\n\
          \      claimName: chaos-test-pvc\nEOF\n\nkubectl wait --for=condition=Ready\
          \ pod/chaos-test-writer -n default --timeout=300s\n\n# Verify data\nkubectl\
          \ exec chaos-test-writer -n default -- cat /data/test.txt\n\n# Cleanup\n\
          kubectl delete pod chaos-test-writer -n default\nkubectl delete pvc chaos-test-pvc\
          \ -n default\n\necho \"[SUCCESS] Backup system test completed\"\n"
  - name: storage-recovery-validation
    templateType: Task
    deadline: 10m
    task:
      container:
        name: validation
        image: rook/ceph:v1.12.8
        command:
        - sh
        args:
        - -c
        - 'echo "Validating Ceph cluster health..."


          # Check cluster health

          ceph health detail


          # Check OSD status

          ceph osd status


          # Check placement group status

          ceph pg stat


          # Verify no data loss

          ceph df


          echo "[SUCCESS] Storage system validated successfully!"

          '
