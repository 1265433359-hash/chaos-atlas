apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: observability-resilience-test
  namespace: chaos-mesh
  labels:
    experiment-type: observability-resilience
    severity: high
spec:
  entry: observability-chaos-workflow
  templates:
  - name: observability-chaos-workflow
    templateType: Parallel
    deadline: 45m
    children:
    - mimir-pod-chaos
    - loki-network-chaos
    - grafana-stress-chaos
    - prometheus-io-chaos
  - name: mimir-pod-chaos
    templateType: PodChaos
    deadline: 15m
    podChaos:
      action: pod-failure
      mode: fixed-percent
      value: '33'
      selector:
        namespaces:
        - observability
        labelSelectors:
          app.kubernetes.io/name: mimir
  - name: loki-network-chaos
    templateType: NetworkChaos
    deadline: 15m
    networkChaos:
      action: netem
      mode: fixed
      value: '1'
      netem:
        delay:
          latency: 500ms
          jitter: 100ms
        loss:
          loss: '5'
      selector:
        namespaces:
        - observability
        labelSelectors:
          app.kubernetes.io/name: loki
  - name: grafana-stress-chaos
    templateType: StressChaos
    deadline: 15m
    stressChaos:
      mode: fixed
      value: '1'
      stressors:
        cpu:
          workers: 2
          load: 70
        memory:
          workers: 1
          size: 512MB
      selector:
        namespaces:
        - observability
        labelSelectors:
          app.kubernetes.io/name: grafana
  - name: prometheus-io-chaos
    templateType: IOChaos
    deadline: 15m
    ioChaos:
      action: latency
      mode: fixed
      value: '1'
      delay: 1s
      percent: 30
      path: /prometheus
      selector:
        namespaces:
        - observability
        labelSelectors:
          app.kubernetes.io/name: prometheus
