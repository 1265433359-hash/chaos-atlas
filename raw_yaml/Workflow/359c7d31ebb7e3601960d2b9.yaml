apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: template-multi-stage-test
  namespace: chaos-experiments
  labels:
    template: multi-stage
    severity: critical
spec:
  entry: serial
  templates:
  - name: serial
    templateType: Serial
    deadline: 30m
  - name: network-delay
    templateType: NetworkChaos
    deadline: 5m
    spec:
      selector:
        namespaces:
        - production
        labelSelectors:
          tier: api
      mode: all
      action: delay
      delay:
        latency: 100ms
  - name: cpu-stress
    templateType: StressChaos
    deadline: 5m
    spec:
      selector:
        namespaces:
        - production
        labelSelectors:
          tier: worker
      mode: one
      action: cpu
      stressors:
        cpu:
          workers: 2
          load: 50
  - name: pod-kill
    templateType: PodChaos
    deadline: 5m
    spec:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: worker
      mode: one
      action: pod-kill
  serial:
  - network-delay
  - cpu-stress
  - pod-kill
