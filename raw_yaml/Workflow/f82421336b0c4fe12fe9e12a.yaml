apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: database-resilience-workflow
  namespace: chaos-mesh
spec:
  entry: database-chaos
  templates:
  - name: database-chaos
    templateType: Serial
    deadline: 20m
    children:
    - kill-primary-db
    - network-latency-db
    - io-chaos-db
    - validate-recovery
  - name: kill-primary-db
    templateType: PodChaos
    deadline: 2m
    podChaos:
      action: pod-kill
      mode: fixed
      value: '1'
      selector:
        namespaces:
        - microservices
        labelSelectors:
          app: postgresql
          role: primary
  - name: network-latency-db
    templateType: NetworkChaos
    deadline: 5m
    networkChaos:
      action: delay
      mode: all
      selector:
        namespaces:
        - microservices
        labelSelectors:
          app: postgresql
      delay:
        latency: 500ms
        jitter: 100ms
      duration: 3m
  - name: io-chaos-db
    templateType: IOChaos
    deadline: 5m
    ioChaos:
      action: latency
      mode: all
      selector:
        namespaces:
        - microservices
        labelSelectors:
          app: postgresql
      volumePath: /var/lib/postgresql/data
      path: /var/lib/postgresql/data/*
      delay: 200ms
      percent: 75
      duration: 3m
  - name: validate-recovery
    templateType: Suspend
    deadline: 5m
    suspend:
      duration: 5m
