apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: multi-region-failure-workflow
  namespace: chaos-mesh
spec:
  entry: multi-region-chaos
  templates:
  - name: multi-region-chaos
    templateType: Parallel
    deadline: 15m
    children:
    - aws-region-failure
    - gcp-region-failure
    - cross-region-network-chaos
  - name: aws-region-failure
    templateType: Serial
    deadline: 10m
    children:
    - aws-pod-chaos
    - aws-network-chaos
  - name: aws-pod-chaos
    templateType: PodChaos
    deadline: 5m
    podChaos:
      action: pod-failure
      mode: all
      selector:
        namespaces:
        - microservices
        labelSelectors:
          cloud: aws
          region: us-east-1
      duration: 2m
  - name: aws-network-chaos
    templateType: NetworkChaos
    deadline: 5m
    networkChaos:
      action: loss
      mode: all
      selector:
        namespaces:
        - microservices
        labelSelectors:
          cloud: aws
      loss:
        loss: '50'
      duration: 2m
  - name: gcp-region-failure
    templateType: Serial
    deadline: 10m
    children:
    - gcp-stress-chaos
    - gcp-time-chaos
  - name: gcp-stress-chaos
    templateType: StressChaos
    deadline: 5m
    stressChaos:
      mode: all
      selector:
        namespaces:
        - microservices
        labelSelectors:
          cloud: gcp
          region: us-central1
      stressors:
        cpu:
          workers: 4
          load: 95
      duration: 2m
  - name: gcp-time-chaos
    templateType: TimeChaos
    deadline: 5m
    timeChaos:
      mode: all
      selector:
        namespaces:
        - microservices
        labelSelectors:
          cloud: gcp
      timeOffset: +30m
      duration: 2m
  - name: cross-region-network-chaos
    templateType: NetworkChaos
    deadline: 10m
    networkChaos:
      action: partition
      mode: all
      selector:
        namespaces:
        - microservices
        labelSelectors:
          cloud: aws
      direction: both
      target:
        mode: all
        selector:
          namespaces:
          - microservices
          labelSelectors:
            cloud: gcp
      duration: 5m
