apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: full-system-resilience-test
  namespace: chaos-testing
spec:
  entry: entry
  templates:
  - name: entry
    templateType: Serial
    deadline: 30m
    children:
    - pod-failure-test
    - network-delay-test
    - cpu-stress-test
    - validation
  - name: pod-failure-test
    templateType: PodChaos
    deadline: 5m
    podChaos:
      action: pod-failure
      mode: fixed
      value: '1'
      selector:
        namespaces:
        - elevatediq
        labelSelectors:
          app: portal-backend
      duration: 2m
  - name: network-delay-test
    templateType: NetworkChaos
    deadline: 5m
    networkChaos:
      action: delay
      mode: all
      selector:
        namespaces:
        - elevatediq
        labelSelectors:
          app: portal-backend
      delay:
        latency: 200ms
      duration: 2m
  - name: cpu-stress-test
    templateType: StressChaos
    deadline: 5m
    stressChaos:
      mode: all
      selector:
        namespaces:
        - elevatediq
        labelSelectors:
          app: portal-backend
      stressors:
        cpu:
          workers: 2
          load: 90
      duration: 2m
  - name: validation
    templateType: Suspend
    deadline: 2m
