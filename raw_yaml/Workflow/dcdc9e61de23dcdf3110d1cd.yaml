apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: kubernetes-infrastructure-chaos
  namespace: chaos-mesh
  labels:
    experiment-type: infrastructure
    severity: critical
spec:
  entry: infrastructure-resilience-test
  templates:
  - name: infrastructure-resilience-test
    templateType: Serial
    deadline: 60m
    children:
    - etcd-performance-degradation
    - api-server-stress-test
    - scheduler-disruption
    - kubelet-network-issues
    - recovery-validation
  - name: etcd-performance-degradation
    templateType: StressChaos
    deadline: 10m
    stressChaos:
      mode: fixed
      value: '1'
      stressors:
        cpu:
          workers: 1
          load: 50
      selector:
        namespaces:
        - kube-system
        labelSelectors:
          component: etcd
  - name: api-server-stress-test
    templateType: StressChaos
    deadline: 10m
    stressChaos:
      mode: fixed
      value: '1'
      stressors:
        memory:
          workers: 1
          size: 1GB
      selector:
        namespaces:
        - kube-system
        labelSelectors:
          component: kube-apiserver
  - name: scheduler-disruption
    templateType: PodChaos
    deadline: 5m
    podChaos:
      action: pod-kill
      mode: fixed
      value: '1'
      selector:
        namespaces:
        - kube-system
        labelSelectors:
          component: kube-scheduler
  - name: kubelet-network-issues
    templateType: NetworkChaos
    deadline: 15m
    networkChaos:
      action: netem
      mode: fixed-percent
      value: '20'
      netem:
        delay:
          latency: 200ms
        loss:
          loss: '2'
      direction: both
      selector:
        namespaces:
        - kube-system
        labelSelectors:
          k8s-app: kubelet
  - name: recovery-validation
    templateType: Task
    deadline: 10m
    task:
      container:
        name: validation
        image: bitnami/kubectl:latest
        command:
        - sh
        args:
        - -c
        - "echo \"Validating Kubernetes cluster health...\"\n\n# Check node status\n\
          kubectl get nodes --no-headers | while read node rest; do\n  status=$(echo\
          \ $rest | awk '{print $2}')\n  if [ \"$status\" != \"Ready\" ]; then\n \
          \   echo \"[FAIL] Node $node is not Ready: $status\"\n    exit 1\n  fi\n\
          done\necho \"[SUCCESS] All nodes are Ready\"\n\n# Check system pods\nnot_ready=$(kubectl\
          \ get pods -n kube-system --no-headers | grep -v Running | grep -v Completed\
          \ | wc -l)\nif [ \"$not_ready\" -gt 0 ]; then\n  echo \"[FAIL] $not_ready\
          \ system pods are not running\"\n  kubectl get pods -n kube-system | grep\
          \ -v Running | grep -v Completed\n  exit 1\nfi\necho \"[SUCCESS] All system\
          \ pods are running\"\n\n# Check API server responsiveness\nstart_time=$(date\
          \ +%s)\nkubectl get namespaces > /dev/null\nend_time=$(date +%s)\nresponse_time=$((end_time\
          \ - start_time))\nif [ \"$response_time\" -gt 5 ]; then\n  echo \"[FAIL]\
          \ API server response time too slow: ${response_time}s\"\n  exit 1\nfi\n\
          echo \"[SUCCESS] API server responsive (${response_time}s)\"\n\necho \"\
          [SUCCESS] Kubernetes cluster recovered successfully!\"\n"
