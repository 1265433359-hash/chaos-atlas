apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: infra-pod-failure-test
  namespace: chaos-testing
  labels:
    app: chaos-engineering
    tier: infrastructure
spec:
  entry: serial-pod-failure
  templates:
  - name: serial-pod-failure
    templateType: Serial
    deadline: 2h
    children:
    - pod-failure-001
    - pod-failure-002
    - pod-failure-003
  - name: pod-failure-001
    templateType: PodChaos
    deadline: 10m
    podChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: payment-processor
      mode: one
      action: pod-kill
      gracePeriod: 0
  - name: pod-failure-002
    templateType: PodChaos
    deadline: 10m
    podChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: transaction-auditor
      mode: one
      action: pod-kill
      gracePeriod: 0
  - name: pod-failure-003
    templateType: PodChaos
    deadline: 10m
    podChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: analytics-engine
      mode: one
      action: pod-failure
