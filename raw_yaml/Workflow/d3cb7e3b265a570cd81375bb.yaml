apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: complete-application-chaos-test
  namespace: chaos-testing
spec:
  entry: full-chaos-test
  templates:
  - name: full-chaos-test
    templateType: Serial
    deadline: 2h
    children:
    - api-gateway-tests
    - auth-service-tests
    - payment-service-tests
    - data-service-tests
  - name: api-gateway-tests
    templateType: Parallel
    deadline: 30m
    children:
    - gw-latency
    - gw-error
    - gw-pod-failure
  - name: gw-latency
    templateType: HTTPChaos
    httpChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: api-gateway
      mode: one
      action: delay
      delay: 200ms
      percent: '20'
      target: Service
      port: 8080
  - name: gw-error
    templateType: HTTPChaos
    httpChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: api-gateway
      mode: one
      action: abort
      target: Service
      port: 8080
      percent: '5'
  - name: gw-pod-failure
    templateType: PodChaos
    podChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: api-gateway
      mode: one
      action: pod-failure
  - name: auth-service-tests
    templateType: Parallel
    deadline: 30m
    children:
    - auth-delay
    - auth-error
  - name: auth-delay
    templateType: HTTPChaos
    httpChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: auth-service
      mode: one
      action: delay
      delay: 300ms
      percent: '25'
      target: Service
      port: 8080
  - name: auth-error
    templateType: HTTPChaos
    httpChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: auth-service
      mode: one
      action: response
      target: Service
      port: 8080
      percent: '5'
      code: 401
      body: '{"error": "Unauthorized", "message": "Authentication failed"}'
  - name: payment-service-tests
    templateType: Parallel
    deadline: 30m
    children:
    - payment-delay
    - payment-error
  - name: payment-delay
    templateType: HTTPChaos
    httpChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: payment-processor
      mode: one
      action: delay
      delay: 500ms
      percent: '30'
      target: Service
      port: 8080
  - name: payment-error
    templateType: HTTPChaos
    httpChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: payment-processor
      mode: one
      action: abort
      target: Service
      port: 8080
      percent: '5'
  - name: data-service-tests
    templateType: Parallel
    deadline: 30m
    children:
    - data-delay
    - data-error
  - name: data-delay
    templateType: HTTPChaos
    httpChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: postgres-primary
      mode: one
      action: delay
      delay: 200ms
      percent: '20'
      target: Service
      port: 5432
  - name: data-error
    templateType: HTTPChaos
    httpChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: postgres-primary
      mode: one
      action: abort
      target: Service
      port: 5432
      percent: '3'
