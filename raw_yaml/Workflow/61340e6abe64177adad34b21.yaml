apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: pesitwizard-failover-test
  namespace: staging
  labels:
    app: pesitwizard
    chaos-type: workflow
spec:
  entry: failover-sequence
  templates:
  - name: failover-sequence
    templateType: Serial
    children:
    - step1-kill-leader
    - step2-wait-recovery
    - step3-verify-health
  - name: step1-kill-leader
    templateType: PodChaos
    deadline: 2m
    podChaos:
      action: pod-kill
      mode: one
      selector:
        namespaces:
        - staging
        labelSelectors:
          app: pesitwizard-server
  - name: step2-wait-recovery
    templateType: Suspend
    deadline: 2m
    suspend:
      duration: 60s
  - name: step3-verify-health
    templateType: Task
    deadline: 2m
    task:
      container:
        name: health-check
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - "for i in $(seq 1 30); do\n  if curl -sf http://pesitwizard-server:8080/actuator/health;\
          \ then\n    echo \"Health check passed\"\n    exit 0\n  fi\n  sleep 2\n\
          done\necho \"Health check failed\"\nexit 1\n"
