apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: database-failover-test
  namespace: chaos-testing
spec:
  entry: db-chaos-workflow
  templates:
  - name: db-chaos-workflow
    templateType: Serial
    deadline: 30m
    children:
    - db-connection-delay
    - db-pod-failure
    - db-recovery
  - name: db-connection-delay
    templateType: HTTPChaos
    deadline: 5m
    httpChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: postgres-primary
      mode: one
      action: delay
      delay: 500ms
      percent: '50'
      target: Service
      port: 5432
  - name: db-pod-failure
    templateType: PodChaos
    deadline: 10m
    podChaos:
      selector:
        namespaces:
        - production
        labelSelectors:
          app: postgres-primary
      mode: one
      action: pod-failure
  - name: db-recovery
    templateType: Duration
    deadline: 5m
    duration: 5m
