apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  generateName: chaos-gate-
  namespace: url-shortener-staging
  labels:
    app: chaos-gate
spec:
  entry: gate-serial
  templates:
  - name: gate-serial
    templateType: Serial
    deadline: 720s
    children:
    - warmup
    - postgres
    - redis
    - signer
    - settle
  - name: warmup
    templateType: Suspend
    deadline: 90s
  - name: postgres
    templateType: PodChaos
    deadline: 120s
    podChaos:
      action: pod-failure
      mode: one
      selector:
        namespaces:
        - url-shortener-staging
        labelSelectors:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/instance: url-shortener-staging
          app.kubernetes.io/component: primary
  - name: redis
    templateType: PodChaos
    deadline: 90s
    podChaos:
      action: pod-failure
      mode: one
      selector:
        namespaces:
        - url-shortener-staging
        labelSelectors:
          app.kubernetes.io/name: redis
          app.kubernetes.io/instance: url-shortener-staging
          app.kubernetes.io/component: master
  - name: signer
    templateType: PodChaos
    deadline: 90s
    podChaos:
      action: pod-failure
      mode: one
      selector:
        namespaces:
        - url-shortener-staging
        labelSelectors:
          app: radius-signer
  - name: settle
    templateType: Suspend
    deadline: 60s
