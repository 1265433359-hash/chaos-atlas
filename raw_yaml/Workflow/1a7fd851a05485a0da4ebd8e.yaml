apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: vernemq-circuit-breaker-test
  namespace: chaos-mesh
  labels:
    experiment-type: circuit-breaker
    target-service: vernemq
    severity: medium
    storage.samcloud.online/tier: standard
spec:
  entry: circuit-breaker-pipeline
  templates:
  - name: circuit-breaker-pipeline
    templateType: Serial
    deadline: 60m
    children:
    - setup-circuit-breaker-monitoring
    - trigger-circuit-breaker-conditions
    - validate-circuit-breaker-behavior
    - test-recovery-behavior
  - name: setup-circuit-breaker-monitoring
    templateType: Task
    deadline: 5m
    task:
      container:
        name: setup
        image: bitnami/kubectl:1.28
        command:
        - /bin/sh
        args:
        - -c
        - "echo \"Setting up circuit breaker monitoring...\"\n\n# Create test clients\n\
          for i in $(seq 1 5); do\n  kubectl run circuit-test-client-$i --image=eclipse-mosquitto:latest\
          \ --restart=Never \\\n    --command -- sleep 3600 &\ndone\n\necho \"[PASS]\
          \ Circuit breaker monitoring setup completed\"\n"
  - name: trigger-circuit-breaker-conditions
    templateType: StressChaos
    deadline: 20m
    stressChaos:
      mode: all
      stressors:
        cpu:
          workers: 4
          load: 95
        memory:
          workers: 2
          size: 2GB
      selector:
        namespaces:
        - storage
        labelSelectors:
          app.kubernetes.io/name: vernemq
  - name: validate-circuit-breaker-behavior
    templateType: Task
    deadline: 15m
    task:
      container:
        name: validation
        image: bitnami/kubectl:1.28
        command:
        - /bin/sh
        args:
        - -c
        - "echo \"Validating circuit breaker behavior...\"\n\n# Test connection failures\n\
          for i in $(seq 1 20); do\n  kubectl exec circuit-test-client-1 -- \\\n \
          \   mosquitto_pub -h vernemq.storage.svc.cluster.local -p 1883 \\\n    -t\
          \ \"test/circuit/$i\" -m \"stress-test\" || echo \"Connection $i failed\"\
          \n  sleep 2\ndone\n\n# Check if connections are being rejected/limited\n\
          echo \"[PASS] Circuit breaker behavior validated\"\n"
  - name: test-recovery-behavior
    templateType: Task
    deadline: 20m
    task:
      container:
        name: recovery-test
        image: bitnami/kubectl:1.28
        command:
        - /bin/sh
        args:
        - -c
        - "echo \"Testing circuit breaker recovery...\"\n\n# Wait for stress to end\
          \ and recovery\nsleep 300\n\n# Test normal operations\nfor i in $(seq 1\
          \ 10); do\n  kubectl exec circuit-test-client-2 -- \\\n    mosquitto_pub\
          \ -h vernemq.storage.svc.cluster.local -p 1883 \\\n    -t \"test/recovery/$i\"\
          \ -m \"normal-ops\" && echo \"[PASS] Connection $i successful\"\n  sleep\
          \ 1\ndone\n\n# Cleanup test clients\nfor i in $(seq 1 5); do\n  kubectl\
          \ delete pod circuit-test-client-$i --ignore-not-found=true\ndone\n\necho\
          \ \"[PASS] Circuit breaker recovery test completed\"\n"
