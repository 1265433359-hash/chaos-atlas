apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: comprehensive-chaos
  namespace: llmchat
spec:
  entry: entry
  templates:
  - name: entry
    templateType: Serial
    deadline: 30m
    children:
    - network-delay-step
    - pod-kill-step
    - cpu-stress-step
    - recovery-check
  - name: network-delay-step
    templateType: NetworkChaos
    deadline: 5m
    networkChaos:
      action: delay
      mode: one
      selector:
        namespaces:
        - llmchat
        labelSelectors:
          app: llmchat-backend
      delay:
        latency: 100ms
  - name: pod-kill-step
    templateType: PodChaos
    deadline: 3m
    podChaos:
      action: pod-kill
      mode: one
      selector:
        namespaces:
        - llmchat
        labelSelectors:
          app: llmchat-backend
  - name: cpu-stress-step
    templateType: StressChaos
    deadline: 5m
    stressChaos:
      mode: one
      selector:
        namespaces:
        - llmchat
        labelSelectors:
          app: llmchat-backend
      stressors:
        cpu:
          workers: 2
          load: 70
  - name: recovery-check
    templateType: Suspend
    deadline: 5m
