apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: comprehensive-chaos-test
  namespace: chaos-testing
spec:
  entry: entry
  templates:
  - name: entry
    templateType: Serial
    deadline: 30m
    children:
    - pod-failure-step
    - network-delay-step
    - cpu-stress-step
    - recovery-validation-step
  - name: pod-failure-step
    templateType: PodChaos
    deadline: 5m
    podChaos:
      action: pod-kill
      mode: one
      selector:
        namespaces:
        - self-healing-prod
        labelSelectors:
          app: gateway-service
  - name: network-delay-step
    templateType: NetworkChaos
    deadline: 5m
    networkChaos:
      action: delay
      mode: all
      selector:
        namespaces:
        - self-healing-prod
        labelSelectors:
          app: data-service
      delay:
        latency: 200ms
  - name: cpu-stress-step
    templateType: StressChaos
    deadline: 5m
    stressChaos:
      mode: one
      selector:
        namespaces:
        - self-healing-prod
        labelSelectors:
          app: auth-service
      stressors:
        cpu:
          workers: 2
          load: 90
  - name: recovery-validation-step
    templateType: Suspend
    deadline: 5m
