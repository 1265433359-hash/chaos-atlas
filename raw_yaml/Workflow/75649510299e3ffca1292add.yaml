apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: template-hourly-health-check
  namespace: chaos-experiments
  labels:
    template: health-check
    severity: low
  annotations:
    description: Hourly health check to verify system resilience
spec:
  entry: parallel
  templates:
  - name: parallel
    templateType: Parallel
    deadline: 10m
  - name: latency-check
    templateType: NetworkChaos
    spec:
      selector:
        namespaces:
        - production
        labelSelectors:
          tier: frontend
      mode: percentage
      percent: 10
      action: delay
      delay:
        latency: 50ms
      duration: 1m
  - name: error-check
    templateType: HTTPChaos
    spec:
      selector:
        namespaces:
        - production
        labelSelectors:
          tier: backend
      mode: percentage
      percent: 5
      action: abort
      target: service
      abort:
        code: 500
      duration: 1m
  parallel:
  - latency-check
  - error-check
