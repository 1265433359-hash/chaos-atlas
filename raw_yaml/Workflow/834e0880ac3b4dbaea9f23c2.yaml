apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: pod-kill-workflow
  namespace: chaos-testing
spec:
  entrypoint: pod-kill-chain
  parallelism: 2
  templates:
  - name: pod-kill-chain
    steps:
    - - name: slow-pod-kill
        template: kill-1-pod
    - - name: aggressive-pod-kill
        template: kill-many-pods
    - - name: check-recovery
        template: verify-running
  - name: kill-1-pod
    chaos:
      podChaos:
        action: pod-kill
        duration: 5m
        selector:
          namespaces:
          - production
          labelSelectors:
            app: api-service
        mode: fixed
        value: '1'
  - name: kill-many-pods
    chaos:
      podChaos:
        action: pod-kill
        duration: 3m
        selector:
          namespaces:
          - production
          labelSelectors:
            app: api-service
        mode: percentage
        value: '50'
  - name: verify-running
    statusCheck:
      duration: 5m
      conditions:
      - type: PodRunning
        selector:
          namespaces:
          - production
          labelSelectors:
            app: api-service
        expectedCount: '3'
