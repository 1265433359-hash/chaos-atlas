apiVersion: chaos-mesh.org/v1alpha1
kind: JVMChaos
metadata:
  name: jvm-exception-experiment
  namespace: qbitel
spec:
  action: exception
  mode: one
  selector:
    namespaces:
    - qbitel
    labelSelectors:
      app: qbitel
      runtime: jvm
  class: com.qbitel.ai.Service
  method: processRequest
  exception: java.lang.RuntimeException('Chaos injection')
  duration: 2m
