apiVersion: chaos-mesh.org/v1alpha1
kind: JVMChaos
metadata:
  name: jvm-exception
  namespace: chaos-testing
spec:
  action: exception
  mode: one
  duration: 5m
  selector:
    namespaces:
    - skalean-system
    labelSelectors:
      runtime: java
  class: com.skalean.api.controller.WorkflowController
  method: executeWorkflow
  exception: java.lang.RuntimeException
  scheduler:
    cron: '@every 6h'
