apiVersion: chaos-mesh.org/v1alpha1
kind: PhysicalMachineChaos
metadata:
  name: node-cpu-stress
  namespace: chaos-testing
  labels:
    experiment: node-chaos
    severity: high
spec:
  selector:
    labelSelectors:
      node-role.kubernetes.io/worker: ''
  mode: one
  action: cpu
  cpu: 4
  duration: 10m
